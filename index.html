<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>เลือกแบบฝึกหัด</title>
    <style>
        :root {
            --primary: #007AFF; --bg: #F2F2F7; --surface: #FFFFFF;
            --text-main: #1C1C1E; --text-muted: #8E8E93; --border: #C6C6C8; /* สีขอบเข้มขึ้นให้เห็นชัดเจน */
            --radius-lg: 20px; --radius-md: 12px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: env(safe-area-inset-top) 24px 24px; padding-top: 40px; }

        /* 🗂️ Top Panel (ตีกรอบรวมส่วนหัวทั้งหมด ไม่ให้ลอย) */
        .top-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .app-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
        .app-title { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.5px; display: flex; align-items: center; gap: 12px; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: 0.2s; border: none; min-height: 44px; padding: 0 20px; }
        .btn:active { transform: scale(0.95); }
        .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-danger { background: #FFF0F0; color: #FF3B30; border: 1px solid #FFE5E5; }

        .admin-controls { display: none; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; background: #E8F5E9; padding: 16px 20px; border-radius: 16px; border: 1px solid #C8E6C9; margin-bottom: 24px; }
        .admin-controls span { color: #2E7D32; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .admin-actions { display: flex; gap: 8px; }

        .search-wrapper { position: relative; width: 100%; }
        .search-input { width: 100%; padding: 16px 20px 16px 48px; font-size: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); color: var(--text-main); outline: none; transition: 0.2s; }
        .search-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-muted); pointer-events: none; }

        /* 🖼️ Gallery */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; padding-bottom: 40px; }
        .card { background: var(--surface); border-radius: var(--radius-lg); padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.03); border: 1px solid var(--border); cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; }
        .card:hover { border-color: #A1A1A6; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
        .card:active { transform: scale(0.96); }
        .card-img-wrapper { position: relative; width: 100%; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; background: #F2F2F7; margin-bottom: 16px; border: 1px solid rgba(0,0,0,0.05); }
        .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .page-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); }
        .card-info { padding: 0 4px; }
        .card-title { margin: 0 0 8px 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .card-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .type-tag { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
        .type-tag.pdf { background: #FFE5E5; color: #FF3B30; }
        .type-tag.img { background: #E5F0FF; color: var(--primary); }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        .modal-content { background: var(--surface); padding: 32px; border-radius: 24px; width: 90%; max-width: 400px; box-shadow: 0 24px 48px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        .modal-title { margin: 0 0 24px; text-align: center; font-size: 22px; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .form-input { width: 100%; padding: 14px 16px; font-size: 16px; border: 1px solid var(--border); border-radius: 12px; outline: none; background: var(--bg); transition: 0.2s; }
        .form-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
        .modal-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
        .btn-full { width: 100%; min-height: 48px; font-size: 16px; }
        .error-msg { color: #FF3B30; font-size: 14px; margin-bottom: 16px; display: none; text-align: center; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 🗂️ ส่วนหัวตีกรอบรวมกัน -->
        <div class="top-panel">
            <header class="app-header">
                <h1 class="app-title">📖 คลังแบบฝึกหัด</h1>
                <button class="btn btn-outline" id="adminTrigger">⚙️ จัดการระบบ</button>
            </header>

            <div class="admin-controls" id="adminBanner">
                <span>🔒 คุณอยู่ในระบบแอดมิน</span>
                <div class="admin-actions">
                    <button class="btn btn-primary" onclick="window.location.href='admin.html'">จัดการไฟล์</button>
                    <button class="btn btn-danger" onclick="logout()">ออกจากระบบ</button>
                </div>
            </div>

            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาชื่อแบบฝึกหัด...">
            </div>
        </div>

        <!-- 🖼️ ส่วนแสดงผลการ์ด -->
        <div class="gallery" id="gallery">
            <p style="grid-column: 1/-1; color: var(--text-muted); font-size: 16px; text-align: center; padding: 40px;">⏳ กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <!-- หน้าต่าง Login แอดมิน -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2 class="modal-title">เข้าสู่ระบบแอดมิน</h2>
            <div class="form-group">
                <label>อีเมล</label>
                <input type="email" id="adminEmail" class="form-input" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" id="adminPassword" class="form-input" placeholder="••••••••">
            </div>
            <p class="error-msg" id="loginError">รหัสผ่านหรืออีเมลไม่ถูกต้อง!</p>
            <div class="modal-actions">
                <button class="btn btn-primary btn-full" id="btnLogin">เข้าสู่ระบบ</button>
                <button class="btn btn-outline btn-full" id="btnCancel">ยกเลิก</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyA1sFQMLA7pd8sRkeqIH5H7Ixo7oDKBqeY", authDomain: "ipadeditpdf.firebaseapp.com", projectId: "ipadeditpdf", storageBucket: "ipadeditpdf.firebasestorage.app", messagingSenderId: "690618814362", appId: "1:690618814362:web:42c3779fd7b2b7e0d0b423" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
        
        let allItems = [];
        const ui = {
            gallery: document.getElementById('gallery'), search: document.getElementById('searchInput'),
            adminBtn: document.getElementById('adminTrigger'), adminBanner: document.getElementById('adminBanner'),
            modal: document.getElementById('adminModal'), btnCancel: document.getElementById('btnCancel'), btnLogin: document.getElementById('btnLogin')
        };

        ui.adminBtn.onclick = () => ui.modal.style.display = 'flex';
        ui.btnCancel.onclick = () => { ui.modal.style.display = 'none'; document.getElementById('loginError').style.display = 'none'; };

        ui.btnLogin.onclick = async () => {
            const email = document.getElementById('adminEmail').value, pass = document.getElementById('adminPassword').value;
            if(!email || !pass) return;
            ui.btnLogin.textContent = "กำลังตรวจสอบ...";
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = "admin.html";
            } catch (e) {
                document.getElementById('loginError').style.display = 'block'; ui.btnLogin.textContent = "เข้าสู่ระบบ";
            }
        };

        onAuthStateChanged(auth, user => {
            ui.adminBanner.style.display = user ? 'flex' : 'none';
            ui.adminBtn.style.display = user ? 'none' : 'inline-flex';
        });

        window.logout = async () => { await signOut(auth); window.location.reload(); };

        async function fetchGallery() {
            try {
                const q = query(collection(db, "workbooks"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                snap.forEach(doc => allItems.push({ id: doc.id, ...doc.data() }));
                renderGallery(allItems);
            } catch (e) { ui.gallery.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#FF3B30;">❌ โหลดข้อมูลล้มเหลว</p>'; }
        }

        function renderGallery(items) {
            ui.gallery.innerHTML = items.length ? '' : '<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">ไม่พบข้อมูลในระบบ</p>';
            items.forEach(item => {
                const urls = item.url.split('|'), pageCount = urls.length;
                const fileType = pageCount > 1 ? 'PDF' : 'IMG', fileClass = pageCount > 1 ? 'pdf' : 'img';
                const dateStr = item.createdAt ? (item.createdAt.toDate ? item.createdAt.toDate() : new Date(item.createdAt)).toLocaleDateString('th-TH', {day:'numeric',month:'short',year:'2-digit'}) : '';
                
                const card = document.createElement('div'); card.className = 'card'; card.onclick = () => window.location.href = `edit.html?id=${item.id}`;
                card.innerHTML = `
                    <div class="card-img-wrapper"><img src="${urls[0]}" loading="lazy"><span class="page-badge">${pageCount} หน้า</span></div>
                    <div class="card-info">
                        <p class="card-title" title="${item.name}">${item.name}</p>
                        <div class="card-meta"><span class="type-tag ${fileClass}">${fileType}</span><span>${dateStr}</span></div>
                    </div>`;
                ui.gallery.appendChild(card);
            });
        }

        ui.search.oninput = e => renderGallery(allItems.filter(i => i.name.toLowerCase().includes(e.target.value.toLowerCase())));
        fetchGallery();
    </script>
</body>
</html>
