<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>เลือกกระดานวาดรูป</title>
    <style>
        :root {
            --system-blue: #007AFF; --system-bg: #F4F5F7; --system-surface: #FFFFFF;
            --text-primary: #1D1D1F; --text-secondary: #8E8E93; --border: #E5E5EA;
            --radius-lg: 20px; --radius-md: 12px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--system-bg); color: var(--text-primary);
            margin: 0; padding: env(safe-area-inset-top) 24px 40px;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Top Navigation */
        .top-bar { display: flex; justify-content: flex-end; padding: 16px 0; }
        .btn-admin-visible {
            background: var(--system-surface); color: var(--system-blue); border: 1px solid var(--border);
            padding: 10px 20px; border-radius: 24px; font-size: 15px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: 0.2s; min-height: 44px;
        }
        .btn-admin-visible:active { transform: scale(0.96); background: var(--system-blue); color: #fff; }

        h1 { text-align: center; font-size: 32px; font-weight: 700; margin: 10px 0 30px; letter-spacing: -0.5px; }
        
        /* Admin Banner */
        #adminBanner { 
            display: none; background: #E4F8EB; border: 1px solid #34C759; color: #248A3D; 
            padding: 16px 24px; border-radius: var(--radius-lg); margin: 0 auto 30px; font-weight: 600; 
            max-width: 600px; justify-content: space-between; align-items: center; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.1);
        }
        .admin-actions { display: flex; gap: 8px; }
        .admin-actions button { background: white; border: 1px solid #34C759; color: #34C759; padding: 10px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .admin-actions button:active { transform: scale(0.95); }
        .admin-actions button.logout { border-color: #FF3B30; color: #FF3B30; }

        /* Search Bar */
        .search-container { max-width: 600px; margin: 0 auto 40px; position: relative; }
        .search-input {
            width: 100%; padding: 16px 20px 16px 48px; font-size: 17px; border: none;
            border-radius: 16px; background: var(--system-surface);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); outline: none; transition: 0.2s;
        }
        .search-input:focus { box-shadow: 0 0 0 3px rgba(0,122,255,0.3); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; opacity: 0.5; }
        
        /* Gallery Grid & Cards */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto; }
        .card {
            background: var(--system-surface); border-radius: var(--radius-lg); padding: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.05); border: 1px solid var(--border);
            cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        .card:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        
        .card-img-wrapper {
            position: relative; width: 100%; aspect-ratio: 3/4; border-radius: var(--radius-md); 
            overflow: hidden; background: #fafafa; margin-bottom: 12px;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .page-badge {
            position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.65); color: white;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px;
        }
        
        .card-info { padding: 0 4px 4px; }
        .card-info p { 
            margin: 0 0 6px 0; font-size: 16px; font-weight: 600; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left;
        }
        .card-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .type-icon { 
            display: inline-flex; align-items: center; justify-content: center; 
            padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
        }
        .type-icon.pdf { background: #FFE5E5; color: #FF3B30; }
        .type-icon.img { background: #E5F0FF; color: var(--system-blue); }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .modal-content { background: var(--system-surface); padding: 32px; border-radius: 24px; width: 90%; max-width: 400px; box-shadow: 0 24px 48px rgba(0,0,0,0.2); }
        .modal-content h2 { margin: 0 0 24px; text-align: center; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        .form-group input { width: 100%; padding: 14px 16px; font-size: 16px; border: 1px solid var(--border); border-radius: var(--radius-md); outline: none; background: #fafafa; }
        .form-group input:focus { border-color: var(--system-blue); background: #fff; }
        
        .btn { width: 100%; padding: 16px; font-size: 17px; font-weight: 600; border-radius: var(--radius-md); border: none; cursor: pointer; transition: 0.2s; min-height: 50px; }
        .btn-primary { background: var(--system-blue); color: white; margin-bottom: 12px; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-cancel { background: #E5E5EA; color: var(--text-primary); }
        .btn-cancel:active { background: #D1D1D6; }
        .error-text { color: #FF3B30; font-size: 14px; margin-bottom: 16px; display: none; text-align: center; }
    </style>
</head>
<body>
    
    <div class="top-bar">
        <button class="btn-admin-visible" id="adminTrigger">⚙️ จัดการระบบ</button>
    </div>

    <h1>📖 เลือกรูปภาพ/แบบฝึกหัด</h1>
    
    <div id="adminBanner">
        <span>🔒 คุณอยู่ในระบบแอดมิน</span>
        <div class="admin-actions">
            <button onclick="window.location.href='admin.html'">จัดการรูปภาพ</button>
            <button class="logout" onclick="logout()">ออกจากระบบ</button>
        </div>
    </div>

    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาชื่อแบบฝึกหัด..." aria-label="ค้นหาชื่อรูปภาพ">
    </div>

    <div class="gallery" id="gallery">
        <p style="grid-column: 1 / -1; color: #8E8E93; font-size: 18px; text-align: center; padding: 40px;">⏳ กำลังโหลดข้อมูล...</p>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <h2>🔒 เข้าสู่ระบบแอดมิน</h2>
            <div class="form-group">
                <label for="adminEmail">อีเมลแอดมิน</label>
                <input type="email" id="adminEmail" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label for="adminPassword">รหัสผ่าน</label>
                <input type="password" id="adminPassword" placeholder="••••••••">
            </div>
            <p class="error-text" id="loginError">รหัสผ่านหรืออีเมลไม่ถูกต้อง!</p>
            <button class="btn btn-primary" id="btnLogin">เข้าสู่ระบบ</button>
            <button class="btn btn-cancel" id="btnCancel">ยกเลิก</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1sFQMLA7pd8sRkeqIH5H7Ixo7oDKBqeY",
            authDomain: "ipadeditpdf.firebaseapp.com",
            projectId: "ipadeditpdf",
            storageBucket: "ipadeditpdf.firebasestorage.app",
            messagingSenderId: "690618814362",
            appId: "1:690618814362:web:42c3779fd7b2b7e0d0b423"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const galleryDiv = document.getElementById('gallery');
        const searchInput = document.getElementById('searchInput');
        const adminTrigger = document.getElementById('adminTrigger');
        const adminModal = document.getElementById('adminModal');
        const btnCancel = document.getElementById('btnCancel');
        const btnLogin = document.getElementById('btnLogin');
        const adminBanner = document.getElementById('adminBanner');
        let allItems = [];

        adminTrigger.addEventListener('click', () => adminModal.style.display = 'flex');
        btnCancel.addEventListener('click', () => {
            adminModal.style.display = 'none';
            document.getElementById('loginError').style.display = 'none';
        });

        btnLogin.addEventListener('click', async () => {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            if(!email || !password) return;
            btnLogin.textContent = "กำลังตรวจสอบ...";
            try {
                await signInWithEmailAndPassword(auth, email, password);
                adminModal.style.display = 'none';
                window.location.href = "admin.html";
            } catch (error) {
                document.getElementById('loginError').style.display = 'block';
                btnLogin.textContent = "เข้าสู่ระบบ";
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                adminBanner.style.display = 'flex';
                adminTrigger.style.display = 'none';
            } else {
                adminBanner.style.display = 'none';
                adminTrigger.style.display = 'flex';
            }
        });

        window.logout = async () => {
            await signOut(auth);
            window.location.reload();
        };

        async function fetchGallery() {
            try {
                const q = query(collection(db, "workbooks"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => allItems.push({ id: doc.id, ...doc.data() }));
                renderGallery(allItems);
            } catch (error) {
                galleryDiv.innerHTML = '<p style="grid-column: 1 / -1; color: #FF3B30; text-align: center; padding: 40px;">❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้</p>';
            }
        }

        function renderGallery(items) {
            galleryDiv.innerHTML = '';
            if(items.length === 0) {
                galleryDiv.innerHTML = '<p style="grid-column: 1 / -1; color: #8E8E93; font-size: 16px; text-align: center; padding: 40px;">ยังไม่มีรูปภาพในระบบ</p>';
                return;
            }
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.location.href = `edit.html?id=${item.id}`;
                
                // คำนวณจำนวนหน้าและประเภทไฟล์
                const urls = item.url.split('|');
                const pageCount = urls.length;
                const coverImg = urls[0];
                const fileType = pageCount > 1 ? 'PDF' : 'IMG';
                const fileClass = pageCount > 1 ? 'pdf' : 'img';
                
                // จัดการรูปแบบวันที่
                let dateStr = "ไม่มีวันที่";
                if(item.createdAt) {
                    const dateObj = item.createdAt.toDate ? item.createdAt.toDate() : new Date(item.createdAt);
                    dateStr = dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
                }

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${coverImg}" alt="${item.name}" loading="lazy">
                        <span class="page-badge">${pageCount} หน้า</span>
                    </div>
                    <div class="card-info">
                        <p title="${item.name}">${item.name}</p>
                        <div class="card-meta">
                            <span class="type-icon ${fileClass}">${fileType}</span>
                            <span>${dateStr}</span>
                        </div>
                    </div>
                `;
                galleryDiv.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            renderGallery(allItems.filter(item => item.name.toLowerCase().includes(keyword)));
        });

        fetchGallery();
    </script>
</body>
</html>
