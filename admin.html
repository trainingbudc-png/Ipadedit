<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>จัดการระบบ (Admin)</title>
    
    <!-- นำเข้าไลบรารี PDF.js สำหรับอ่านไฟล์ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        /* จัด UX/UI ให้เป็นระเบียบและใช้งานง่ายบน iPad */
        :root {
            --primary: #007AFF;
            --danger: #FF3B30;
            --bg: #F4F5F7;
            --text: #1D1D1F;
            --card-bg: #FFFFFF;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); margin: 0; padding: 30px 20px; color: var(--text); -webkit-font-smoothing: antialiased;}

        .container { max-width: 700px; margin: 0 auto; display: none; /* ซ่อนไว้ก่อนจนกว่าจะเช็คสิทธิ์ผ่าน */ }

        .btn-back {
            display: inline-flex; align-items: center; justify-content: center;
            background: #ffffff; color: #555; border: 1px solid #e0e0e5;
            padding: 10px 20px; border-radius: 20px; text-decoration: none;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;
            margin-bottom: 20px;
        }
        .btn-back:active { transform: scale(0.95); }

        .card {
            background: var(--card-bg); border-radius: 16px; padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); margin-bottom: 25px;
        }

        .section-header { text-align: center; margin-bottom: 20px; }
        .section-header h2 { margin: 0 0 5px 0; font-size: 22px; }
        .section-header p { margin: 0; color: #86868b; font-size: 14px; }

        input[type="text"] {
            width: 100%; padding: 16px; border: 2px solid #e0e0e5; border-radius: 12px;
            font-size: 16px; outline: none; transition: 0.2s; margin-bottom: 20px; background: #fafafa;
        }
        input[type="text"]:focus { border-color: var(--primary); background: #fff;}

        .file-upload-wrapper {
            position: relative; border: 2px dashed #d1d1d6; border-radius: 12px; padding: 40px 20px;
            text-align: center; cursor: pointer; transition: 0.2s; margin-bottom: 20px; background: #fafafa;
        }
        .file-upload-input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-text { color: #86868b; font-size: 16px; font-weight: bold; pointer-events: none; }

        .btn-upload {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        .btn-upload:active:not(:disabled) { transform: scale(0.98); }
        .btn-upload:disabled { opacity: 0.6; cursor: not-allowed; }

        #status { margin-top: 15px; font-weight: bold; font-size: 14px; text-align: center; }

        .list-container { display: flex; flex-direction: column; gap: 12px; }
        .list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border: 1px solid #e0e0e5; border-radius: 12px;
            background: #ffffff;
        }
        .list-info { display: flex; align-items: center; gap: 15px; }
        .list-info img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #eee; }
        .list-name { font-size: 16px; font-weight: 600; }

        .btn-delete {
            background: #ffebeb; color: var(--danger); border: none; padding: 10px 16px;
            border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-delete:active:not(:disabled) { transform: scale(0.95); }

        /* โหลดหน้าจอ (Loading Overlay) */
        #pageLoader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; justify-content: center; align-items: center;
            z-index: 1000; font-size: 18px; font-weight: bold; color: #555;
        }
    </style>
</head>
<body>

    <div id="pageLoader">⏳ กำลังตรวจสอบสิทธิ์...</div>

    <div class="container" id="mainContainer">
        <button class="btn-back" onclick="window.location.href='index.html'">← กลับหน้าแกลลอรี่</button>

        <!-- กล่อง 1: เพิ่มข้อมูล -->
        <div class="card">
            <div class="section-header">
                <h2>📁 อัปโหลดรูปภาพ / PDF</h2>
                <p>ไฟล์จะถูกเก็บอย่างปลอดภัยใน Firebase Storage</p>
            </div>

            <input type="text" id="fileName" placeholder="ตั้งชื่อรูปภาพหรือแบบฝึกหัด..." required>
            
            <div class="file-upload-wrapper">
                <span class="file-upload-text" id="fileLabelText">คลิกเพื่อเลือกไฟล์ (JPG, PNG, PDF)</span>
                <input type="file" id="fileInput" class="file-upload-input" accept="image/*, application/pdf" required>
            </div>
            
            <button id="uploadBtn" class="btn-upload">อัปโหลดเข้าสู่ระบบ</button>
            <div id="status"></div>
        </div>

        <!-- กล่อง 2: จัดการข้อมูล -->
        <div class="card">
            <div class="section-header">
                <h2>🗂️ จัดการรูปภาพในระบบ</h2>
            </div>
            
            <input type="text" id="adminSearchInput" placeholder="🔍 ค้นหาชื่อรูปภาพ...">
            <div id="adminGallery" class="list-container"></div>
        </div>
    </div>

    <!-- โค้ด JavaScript ผูกกับ Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1sFQMLA7pd8sRkeqIH5H7Ixo7oDKBqeY",
            authDomain: "ipadeditpdf.firebaseapp.com",
            projectId: "ipadeditpdf",
            storageBucket: "ipadeditpdf.firebasestorage.app",
            messagingSenderId: "690618814362",
            appId: "1:690618814362:web:42c3779fd7b2b7e0d0b423"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        // --- 1. ระบบรักษาความปลอดภัย: เช็คว่าแอดมินล็อกอินหรือยัง ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ถ้าล็อกอินแล้ว ให้ปิดหน้าต่างโหลด และแสดงเนื้อหาแอดมิน
                document.getElementById('pageLoader').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                loadAdminGallery();
            } else {
                // ถ้ายังไม่ล็อกอิน เตะกลับไปหน้าแรกทันที
                alert("คุณไม่มีสิทธิ์เข้าถึงหน้านี้ กรุณาเข้าสู่ระบบ");
                window.location.href = "index.html";
            }
        });

        const adminGallery = document.getElementById('adminGallery');
        const adminSearchInput = document.getElementById('adminSearchInput');
        const fileInput = document.getElementById('fileInput');
        const fileLabelText = document.getElementById('fileLabelText');
        let allAdminItems = []; 

        // แสดงชื่อไฟล์เมื่อเลือก
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                fileLabelText.textContent = "📄 " + e.target.files[0].name;
                fileLabelText.style.color = '#007AFF';
            } else {
                fileLabelText.textContent = 'คลิกเพื่อเลือกไฟล์ (JPG, PNG, PDF)';
                fileLabelText.style.color = '#86868b';
            }
        });

        // --- 2. โหลดรายการรูปภาพ ---
        async function loadAdminGallery() {
            adminGallery.innerHTML = '<p style="text-align: center; color: #86868b;">⏳ กำลังโหลดข้อมูล...</p>';
            try {
                const q = query(collection(db, "workbooks"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allAdminItems = []; 
                querySnapshot.forEach((documentSnapshot) => {
                    allAdminItems.push({ id: documentSnapshot.id, ...documentSnapshot.data() });
                });
                renderAdminList(allAdminItems);
            } catch (error) {
                adminGallery.innerHTML = "<p style='color: red; text-align: center;'>❌ ไม่สามารถโหลดข้อมูลได้</p>";
            }
        }

        function renderAdminList(items) {
            adminGallery.innerHTML = ''; 
            if (items.length === 0) { 
                adminGallery.innerHTML = "<p style='text-align: center; color: #86868b;'>ไม่มีข้อมูลในระบบ</p>"; 
                return; 
            }

            items.forEach((data) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'list-item';
                const coverImage = data.url.split('|')[0]; 

                itemDiv.innerHTML = `
                    <div class="list-info">
                        <img src="${coverImage}" alt="${data.name}">
                        <span class="list-name">${data.name}</span>
                    </div>
                `;
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete';
                deleteBtn.innerHTML = "ลบ";
                deleteBtn.onclick = async () => {
                    if (confirm(`ต้องการลบ: "${data.name}" ใช่หรือไม่?`)) {
                        deleteBtn.innerHTML = "กำลังลบ..."; deleteBtn.disabled = true;
                        try {
                            await deleteDoc(doc(db, "workbooks", data.id));
                            loadAdminGallery(); 
                        } catch (error) {
                            alert("❌ เกิดข้อผิดพลาดในการลบ: " + error.message); 
                            deleteBtn.disabled = false;
                        }
                    }
                };
                itemDiv.appendChild(deleteBtn);
                adminGallery.appendChild(itemDiv);
            });
        }

        adminSearchInput.addEventListener('input', (e) => {
            renderAdminList(allAdminItems.filter(item => item.name.toLowerCase().includes(e.target.value.toLowerCase())));
        });

        // --- 3. ระบบอัปโหลดเข้า Firebase Storage โดยตรง ---
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileName = document.getElementById('fileName').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (!fileName || !fileInput.files[0]) { alert('กรุณากรอกชื่อและเลือกไฟล์'); return; }

            statusDiv.style.color = "#007AFF";
            btn.disabled = true;
            btn.innerHTML = "กำลังเตรียมการ...";
            let finalImageUrl = ""; 

            try {
                const file = fileInput.files[0];
                
                if (file.type === "application/pdf") {
                    statusDiv.innerHTML = "กำลังประมวลผล PDF...";
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    const totalPages = pdf.numPages; 
                    let uploadedUrls = []; 

                    for (let i = 1; i <= totalPages; i++) {
                        statusDiv.innerHTML = `กำลังอัปโหลดหน้า ${i} / ${totalPages}...`;
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({ scale: 2.0 }); 
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width; canvas.height = viewport.height;
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        
                        // แปลง Canvas เป็น Blob เพื่อส่งเข้า Storage
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
                        const storageRef = ref(storage, `workbooks/${Date.now()}_page_${i}.jpg`);
                        
                        await uploadBytes(storageRef, blob);
                        const downloadUrl = await getDownloadURL(storageRef);
                        uploadedUrls.push(downloadUrl);
                    }
                    finalImageUrl = uploadedUrls.join('|'); 
                } 
                else {
                    statusDiv.innerHTML = "กำลังอัปโหลดรูปภาพ...";
                    const storageRef = ref(storage, `workbooks/${Date.now()}_${file.name}`);
                    await uploadBytes(storageRef, file);
                    finalImageUrl = await getDownloadURL(storageRef);
                }

                statusDiv.innerHTML = "กำลังบันทึกลงฐานข้อมูล...";
                await addDoc(collection(db, "workbooks"), {
                    name: fileName,
                    url: finalImageUrl, 
                    createdAt: serverTimestamp()
                });

                statusDiv.innerHTML = "✅ อัปโหลดสำเร็จเรียบร้อย!";
                statusDiv.style.color = "#34C759";
                
                // รีเซ็ตฟอร์ม
                document.getElementById('fileName').value = '';
                fileInput.value = '';
                fileLabelText.textContent = 'คลิกเพื่อเลือกไฟล์ (JPG, PNG, PDF)';
                fileLabelText.style.color = '#86868b';
                loadAdminGallery(); 

            } catch (error) {
                console.error("Upload Error:", error);
                statusDiv.innerHTML = "❌ ข้อผิดพลาด: " + error.message;
                statusDiv.style.color = "#FF3B30";
            } finally {
                btn.disabled = false;
                btn.innerHTML = "อัปโหลดเข้าสู่ระบบ";
            }
        });
    </script>
</body>
</html>
