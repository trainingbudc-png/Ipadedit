<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>จัดการระบบ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
    <style>
        :root { --primary: #007AFF; --danger: #FF3B30; --bg: #F2F2F7; --surface: #FFFFFF; --text-main: #1C1C1E; --text-muted: #8E8E93; --border: #C6C6C8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        body { background-color: var(--bg); margin: 0; padding: 0; color: var(--text-main); -webkit-font-smoothing: antialiased; }
        
        #pageLoader { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; font-size: 16px; font-weight: 600; color: var(--text-muted); }
        .container { max-width: 800px; margin: 0 auto; display: none; padding: env(safe-area-inset-top) 24px 24px; padding-top: 40px; padding-bottom: 60px; }
        
        .header-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
        .btn-back { display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--primary); border: 1px solid var(--border); width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; transition: 0.2s; text-decoration: none; }
        .btn-back:active { transform: scale(0.92); }
        .page-title { font-size: 28px; font-weight: 700; margin: 0; }

        .card-panel { background: var(--surface); border-radius: 24px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); margin-bottom: 24px; }
        .card-header { margin-bottom: 24px; }
        .card-header h2 { margin: 0 0 8px 0; font-size: 20px; font-weight: 700; }
        .card-header p { margin: 0; color: var(--text-muted); font-size: 14px; font-weight: 500; }

        .form-input { width: 100%; padding: 16px 20px; border: 1px solid var(--border); border-radius: 12px; font-size: 16px; outline: none; background: var(--bg); margin-bottom: 20px; transition: 0.2s; }
        .form-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
        
        .upload-zone { border: 2px dashed #A1A1A6; border-radius: 16px; padding: 40px 20px; text-align: center; position: relative; background: #fafafa; transition: 0.2s; margin-bottom: 24px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .upload-zone:hover { border-color: var(--primary); background: #F0F8FF; }
        .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
        .upload-icon { font-size: 32px; opacity: 0.8; }
        .upload-text { color: var(--text-muted); font-size: 15px; font-weight: 600; }
        
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary:active:not(:disabled) { transform: scale(0.98); opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 16px; font-weight: 600; font-size: 14px; text-align: center; }

        .list-container { display: flex; flex-direction: column; }
        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; transition: 0.2s; background: var(--surface); }
        .list-item:hover { border-color: #A1A1A6; }
        .list-info { display: flex; align-items: center; gap: 16px; overflow: hidden; }
        .list-info img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); background: #F2F2F7; }
        .list-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
        .btn-delete { background: #FFF0F0; color: var(--danger); border: 1px solid #FFE5E5; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-delete:active:not(:disabled) { transform: scale(0.92); }
    </style>
</head>
<body>
    <div id="pageLoader">⏳ กำลังตรวจสอบสิทธิ์...</div>

    <div class="container" id="mainContainer">
        <div class="header-bar">
            <a href="index.html" class="btn-back">‹</a>
            <h1 class="page-title">จัดการระบบ</h1>
        </div>

        <div class="card-panel">
            <div class="card-header">
                <h2>อัปโหลดไฟล์ใหม่</h2>
                <p>รองรับไฟล์ PDF หรือรูปภาพ (JPG, PNG)</p>
            </div>
            <input type="text" id="fileName" class="form-input" placeholder="ตั้งชื่อแบบฝึกหัด..." required>
            <div class="upload-zone">
                <span class="upload-icon">📄</span>
                <span class="upload-text" id="fileLabelText">แตะเพื่อเลือกไฟล์</span>
                <input type="file" id="fileInput" accept="image/*, application/pdf" required>
            </div>
            <button id="uploadBtn" class="btn-primary">อัปโหลดเข้าสู่ระบบ</button>
            <div id="status"></div>
        </div>

        <div class="card-panel">
            <div class="card-header">
                <h2>ไฟล์ในระบบ</h2>
            </div>
            <input type="text" id="adminSearchInput" class="form-input" placeholder="ค้นหาชื่อไฟล์...">
            <div id="adminGallery" class="list-container"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const CLOUDINARY_CLOUD_NAME = "uhfvkgnh", CLOUDINARY_UPLOAD_PRESET = "ipadedit";
        const firebaseConfig = { apiKey: "AIzaSyA1sFQMLA7pd8sRkeqIH5H7Ixo7oDKBqeY", authDomain: "ipadeditpdf.firebaseapp.com", projectId: "ipadeditpdf", storageBucket: "ipadeditpdf.firebasestorage.app", messagingSenderId: "690618814362", appId: "1:690618814362:web:42c3779fd7b2b7e0d0b423" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

        onAuthStateChanged(auth, user => {
            if (user) { document.getElementById('pageLoader').style.display = 'none'; document.getElementById('mainContainer').style.display = 'block'; loadAdminGallery(); } 
            else { alert("กรุณาเข้าสู่ระบบ"); window.location.href = "index.html"; }
        });

        const adminGallery = document.getElementById('adminGallery'), searchInput = document.getElementById('adminSearchInput'), fileInput = document.getElementById('fileInput'), fileLabelText = document.getElementById('fileLabelText');
        let allItems = []; 

        fileInput.onchange = e => {
            fileLabelText.textContent = e.target.files.length ? e.target.files[0].name : 'แตะเพื่อเลือกไฟล์';
            fileLabelText.style.color = e.target.files.length ? '#007AFF' : '#8E8E93';
        };

        async function loadAdminGallery() {
            adminGallery.innerHTML = '<p style="text-align:center; color:var(--text-muted);">⏳ กำลังโหลด...</p>';
            try {
                const snap = await getDocs(query(collection(db, "workbooks"), orderBy("createdAt", "desc")));
                allItems = []; snap.forEach(doc => allItems.push({ id: doc.id, ...doc.data() })); renderList(allItems);
            } catch (e) { adminGallery.innerHTML = "<p style='color:red; text-align:center;'>❌ โหลดข้อมูลล้มเหลว</p>"; }
        }

        // 🛑 ฟังก์ชันดึง public_id จาก URL ของ Cloudinary
        function extractPublicId(url) {
            const parts = url.split('/');
            const filenameWithExt = parts[parts.length - 1];
            return filenameWithExt.split('.')[0];
        }

        function renderList(items) {
            adminGallery.innerHTML = items.length ? '' : "<p style='text-align:center; color:var(--text-muted);'>ไม่มีข้อมูล</p>";
            items.forEach(data => {
                const div = document.createElement('div'); div.className = 'list-item';
                div.innerHTML = `<div class="list-info"><img src="${data.url.split('|')[0]}"><span class="list-name" title="${data.name}">${data.name}</span></div>`;
                const delBtn = document.createElement('button'); delBtn.className = 'btn-delete'; delBtn.textContent = "ลบ";
                
                // 🛑 ระบบลบสองเด้ง (Cloudinary + Firebase)
                delBtn.onclick = async () => {
                    if(confirm(`ลบ: "${data.name}" และลบไฟล์รูปภาพออกจากเซิร์ฟเวอร์ด้วยใช่หรือไม่?`)) {
                        delBtn.textContent = "กำลังลบ..."; delBtn.disabled = true;
                        try {
                            const imageUrls = data.url.split('|');
                            
                            // 1. ส่งคำสั่งให้ Vercel API ลบไฟล์รูปทีละหน้าจาก Cloudinary
                            for (const url of imageUrls) {
                                const publicId = extractPublicId(url.trim());
                                if (publicId) {
                                    await fetch('/api/delete', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ public_id: publicId })
                                    });
                                }
                            }

                            // 2. ลบออกจากฐานข้อมูล Firebase
                            await deleteDoc(doc(db, "workbooks", data.id)); 
                            
                            loadAdminGallery(); 
                        } catch(e) { 
                            alert("❌ " + e.message); 
                            delBtn.disabled = false; 
                            delBtn.textContent = "ลบ";
                        }
                    }
                };
                div.appendChild(delBtn); adminGallery.appendChild(div);
            });
        }

        searchInput.oninput = e => renderList(allItems.filter(i => i.name.toLowerCase().includes(e.target.value.toLowerCase())));

        async function uploadToCloudinary(blob) {
            const fd = new FormData(); fd.append("file", blob); fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/upload`, { method: "POST", body: fd });
            const data = await res.json(); if(!res.ok) throw new Error(data.error.message); return data.secure_url;
        }

        document.getElementById('uploadBtn').onclick = async () => {
            const name = document.getElementById('fileName').value, status = document.getElementById('status'), btn = document.getElementById('uploadBtn');
            if(!name || !fileInput.files[0]) return alert('กรุณากรอกชื่อและเลือกไฟล์');
            status.style.color = "var(--primary)"; btn.disabled = true; btn.textContent = "เตรียมการ...";
            try {
                let finalUrl = "", file = fileInput.files[0];
                if(file.type === "application/pdf") {
                    status.textContent = "ประมวลผล PDF...";
                    const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                    let urls = [];
                    for(let i=1; i<=pdf.numPages; i++) {
                        status.textContent = `อัปโหลดหน้า ${i}/${pdf.numPages}...`;
                        const page = await pdf.getPage(i), vp = page.getViewport({scale: 2.0});
                        const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
                        canvas.width = vp.width; canvas.height = vp.height;
                        await page.render({canvasContext: ctx, viewport: vp}).promise;
                        urls.push(await uploadToCloudinary(await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8))));
                    }
                    finalUrl = urls.join('|');
                } else {
                    status.textContent = "อัปโหลดรูปภาพ..."; finalUrl = await uploadToCloudinary(file);
                }
                status.textContent = "บันทึกฐานข้อมูล...";
                await addDoc(collection(db, "workbooks"), { name, url: finalUrl, createdAt: serverTimestamp() });
                status.textContent = "✅ อัปโหลดสำเร็จ!"; status.style.color = "#34C759";
                document.getElementById('fileName').value = ''; fileInput.value = ''; fileLabelText.textContent = 'แตะเพื่อเลือกไฟล์'; fileLabelText.style.color = 'var(--text-muted)';
                loadAdminGallery();
            } catch(e) { status.textContent = "❌ " + e.message; status.style.color = "var(--danger)"; } finally { btn.disabled = false; btn.textContent = "อัปโหลดเข้าสู่ระบบ"; }
        };
    </script>
</body>
</html>
