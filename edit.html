<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>พื้นที่ทำแบบฝึกหัด</title>
    
    <!-- ไลบรารีสำหรับสร้าง PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- ✨ พระเอกของเรา: LocalForage (IndexedDB) สำหรับเก็บลายเส้นไม่จำกัดพื้นที่ ✨ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        * {
            -webkit-touch-callout: none; 
            -webkit-user-select: none;   
            user-select: none;           
            box-sizing: border-box;
        }
        input { -webkit-user-select: auto; user-select: auto; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f5f7; text-align: center; margin: 0; padding: 0 0 40px 0; 
            transition: background-color 0.3s;
            /* ป้องกันการเลื่อนหน้าจอเด้งไปมาบน iPad */
            overscroll-behavior-y: none; 
        }
        
        .header-tools { 
            position: sticky; top: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 12px 20px; border-bottom: 1px solid #e0e0e0;
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        
        .top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; margin: 0 auto; position: relative; }
        .top-group { display: flex; gap: 8px; align-items: center; }
        
        .pagination-center {
            position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center;
            background: #f0f1f4; border-radius: 24px; padding: 4px; gap: 5px;
        }
        .btn-page {
            background: white; border: none; width: 36px; height: 36px; border-radius: 50%; 
            font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #555; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .btn-page:active:not(:disabled) { transform: scale(0.9); }
        .btn-page:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        #pageIndicator { font-size: 14px; font-weight: bold; color: #333; min-width: 70px; text-align: center; }

        .bottom-row { 
            display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; 
            max-width: 900px; margin: 0 auto;
        }

        .btn-action {
            background: #f0f1f4; color: #333; border: none; padding: 10px 16px;
            border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.95); }
        .btn-danger { color: #FF3B30; background: #ffebeb; }
        .btn-primary {
            background: #007AFF; color: white; border: none; padding: 10px 20px;
            border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); transition: 0.2s;
        }
        .btn-primary:active { transform: scale(0.95); }

        .separator { width: 1px; height: 30px; background: #d1d1d6; margin: 0 5px; }

        .tool-btn { 
            background: #f0f1f4; color: #555; border: 2px solid transparent; 
            width: 48px; height: 48px; border-radius: 12px; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center; font-size: 22px; 
        }
        .tool-btn.active { 
            border: 2px solid #007AFF; background: #e5f1ff; 
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2); color: #007AFF;
        }
        
        input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 8px; cursor: pointer; padding: 0; background: none;}
        .slider-group { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #555; }
        input[type="range"] { cursor: pointer; width: 100px; accent-color: #007AFF; }

        #workspace { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; padding: 0 15px;}
        
        .canvas-wrapper { position: relative; background: white; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-radius: 12px; overflow: hidden; }
        .bg-img { width: 100%; display: block; user-select: none; pointer-events: none; }
        
        /* ใช้ touch-action: none เพื่อให้ Apple Pencil วาดได้ลื่นโดยจอไม่เลื่อน */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
        .draft-canvas { pointer-events: none; } 

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center;
        }
        .modal-content h3 { margin-top: 0; margin-bottom: 20px; font-size: 20px; }
        .btn-export { display: block; width: 100%; padding: 16px; margin-bottom: 12px; font-size: 16px; font-weight: bold; border-radius: 12px; color: white; border: none; cursor: pointer; transition: 0.2s;}
        .btn-export:active { transform: scale(0.98); }
        .btn-export.pdf { background: #FF3B30; }
        .btn-export.png { background: #007AFF; }
        .btn-export.jpg { background: #34C759; }
        .btn-export.cancel { background: #f0f1f4; color: #333; margin-top: 15px; }

        /* Dark Theme */
        body.dark-theme { background-color: #121212; }
        body.dark-theme .header-tools { background: rgba(30, 30, 30, 0.95); border-bottom: 1px solid #333; }
        body.dark-theme .btn-action { background: #2c2c2e; color: #eee; }
        body.dark-theme .btn-danger { color: #ff6b63; background: #3a1c1c; }
        body.dark-theme .tool-btn { background: #2c2c2e; }
        body.dark-theme .tool-btn.active { background: #1c3552; border-color: #0a84ff; }
        body.dark-theme .slider-group { color: #ccc; }
        body.dark-theme .pagination-center { background: #2c2c2e; }
        body.dark-theme .btn-page { background: #3a3a3c; color: #ccc; }
        body.dark-theme #pageIndicator { color: #eee; }
        body.dark-theme .canvas-wrapper { box-shadow: 0 5px 30px rgba(0,0,0,0.8); }
        body.dark-theme .modal-content { background: #2c2c2e; color: white; }
        body.dark-theme .btn-export.cancel { background: #444; color: white; }
    </style>
</head>
<body>

    <div class="header-tools">
        <div class="top-row">
            <div class="top-group">
                <button class="btn-action" onclick="goBack()">‹ กลับ</button>
                <div class="separator"></div>
                <button class="btn-action" onclick="undo()" title="ย้อนกลับ">↩</button>
                <button class="btn-action" onclick="redo()" title="ทำซ้ำ">↪</button>
            </div>

            <div class="pagination-center" id="paginationBar" style="display: none;">
                <button class="btn-page" id="btnPrevPage" onclick="prevPage()">◀</button>
                <span id="pageIndicator">1 / 1</span>
                <button class="btn-page" id="btnNextPage" onclick="nextPage()">▶</button>
            </div>

            <div class="top-group">
                <button class="btn-action" id="btnTheme" onclick="toggleTheme()" title="สลับโหมดสี">🌙</button>
                <button class="btn-action btn-danger" onclick="clearDraft()">ล้างหน้า</button>
                <button class="btn-primary" onclick="openExportModal()">ส่งออก</button>
            </div>
        </div>
        
        <div class="bottom-row" id="drawingTools">
            <button class="tool-btn active" id="btnPen" onclick="setTool('pen', this)" title="ปากกา">🖊️</button>
            <button class="tool-btn" id="btnHighlighter" onclick="setTool('highlighter', this)" title="ไฮไลท์">🖍️</button>
            <button class="tool-btn" id="btnEraser" onclick="setTool('eraser', this)" title="ยางลบ">🧽</button>
            
            <div class="separator"></div>
            
            <label class="slider-group">สี: <input type="color" id="colorPicker" value="#000000" onchange="currentColor = this.value; setTool(currentTool === 'eraser' ? 'pen' : currentTool, currentTool === 'eraser' ? document.getElementById('btnPen') : null)"></label>
            
            <div class="separator"></div>
            
            <div class="slider-group">ขนาด: <input type="range" id="sizeSlider" min="1" max="50" value="5" oninput="currentSize = parseInt(this.value)"></div>
            <div class="slider-group">เข้ม: <input type="range" id="opacitySlider" min="0.1" max="1" step="0.1" value="1" oninput="currentOpacity = parseFloat(this.value)"></div>
        </div>
    </div>

    <div id="workspace"></div>

    <div id="exportModal" class="modal-overlay">
        <div class="modal-content">
            <h3>💾 เลือกรูปแบบไฟล์</h3>
            <button class="btn-export pdf" onclick="executeDownload('pdf')">📄 PDF (รวมทุกหน้า)</button>
            <button class="btn-export png" onclick="executeDownload('png')">🖼️ PNG (เฉพาะหน้านี้)</button>
            <button class="btn-export jpg" onclick="executeDownload('jpg')">📸 JPG (เฉพาะหน้านี้)</button>
            <button class="btn-export cancel" onclick="closeExportModal()">ยกเลิก</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1sFQMLA7pd8sRkeqIH5H7Ixo7oDKBqeY",
            authDomain: "ipadeditpdf.firebaseapp.com",
            projectId: "ipadeditpdf",
            storageBucket: "ipadeditpdf.firebasestorage.app",
            messagingSenderId: "690618814362",
            appId: "1:690618814362:web:42c3779fd7b2b7e0d0b423"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');

        // ตั้งค่าระบบฐานข้อมูลในเครื่อง (IndexedDB)
        localforage.config({
            name: 'iPadDrawingApp',
            storeName: 'workbooks_drafts'
        });

        async function init() {
            if (docId) {
                try {
                    const docRef = doc(db, "workbooks", docId);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        window.initializeWorkspace(docSnap.data().url, docId);
                    } else {
                        alert("ไม่พบข้อมูลแบบฝึกหัดนี้"); window.location.href = 'index.html';
                    }
                } catch (e) {
                    console.error(e);
                    alert("เกิดข้อผิดพลาดในการโหลดข้อมูล");
                }
            } else {
                alert("ไม่พบข้อมูลที่ต้องการ"); window.location.href = 'index.html';
            }
        }
        init();
    </script>

    <script>
        let isSafeToLeave = false; 
        window.addEventListener('beforeunload', function (e) { if (!isSafeToLeave) { e.preventDefault(); e.returnValue = ''; } });
        
        function goBack() { 
            if(confirm('คุณต้องการออกจากหน้านี้ใช่ไหม?\n(ระบบบันทึกความคืบหน้าให้แล้ว)')) {
                isSafeToLeave = true; window.location.href = 'index.html'; 
            }
        }

        const workspace = document.getElementById('workspace');
        const drawingTools = document.getElementById('drawingTools');
        
        let isDarkMode = false;
        let currentTool = 'pen'; 
        let currentColor = '#000000';
        let currentSize = 5;
        let currentOpacity = 1.0;
        
        let globalUndoStack = []; 
        let globalRedoStack = []; 
        
        let allPageUrls = [];
        let currentPageIndex = 0;
        let currentDocId = "";

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-theme', isDarkMode);
            document.getElementById('btnTheme').innerHTML = isDarkMode ? '☀️' : '🌙'; 
        }

        function setTool(tool, btnElement) {
            currentTool = tool;
            const btns = drawingTools.querySelectorAll('.tool-btn');
            btns.forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            else document.getElementById(tool === 'highlighter' ? 'btnHighlighter' : 'btnPen').classList.add('active');
        }

        function undo() {
            if (globalUndoStack.length === 0) return;
            const lastState = globalUndoStack.pop();
            const targetCanvas = document.getElementById(`canvas-page-${lastState.index}`);
            if (targetCanvas) {
                const ctx = targetCanvas.getContext('2d');
                globalRedoStack.push({ index: lastState.index, imageData: ctx.getImageData(0, 0, targetCanvas.width, targetCanvas.height) });
                ctx.putImageData(lastState.imageData, 0, 0);
                saveCurrentCanvasAsync();
            }
        }

        function redo() {
            if (globalRedoStack.length === 0) return;
            const nextState = globalRedoStack.pop();
            const targetCanvas = document.getElementById(`canvas-page-${nextState.index}`);
            if (targetCanvas) {
                const ctx = targetCanvas.getContext('2d');
                globalUndoStack.push({ index: nextState.index, imageData: ctx.getImageData(0, 0, targetCanvas.width, targetCanvas.height) });
                ctx.putImageData(nextState.imageData, 0, 0);
                saveCurrentCanvasAsync();
            }
        }

        window.initializeWorkspace = function(imageUrls, docId) {
            allPageUrls = imageUrls.split('|').map(url => url.trim());
            currentDocId = docId;
            currentPageIndex = 0;
            document.getElementById('paginationBar').style.display = allPageUrls.length > 1 ? 'flex' : 'none';
            renderCurrentPage();
        };

        async function renderCurrentPage() {
            workspace.innerHTML = '<p style="text-align:center; color:#888; font-size:18px;">⏳ กำลังโหลดกระดาน...</p>'; 
            globalUndoStack = []; globalRedoStack = [];
            
            await createCanvasPage(allPageUrls[currentPageIndex], currentPageIndex);
            
            document.getElementById('pageIndicator').innerText = `${currentPageIndex + 1} / ${allPageUrls.length}`;
            document.getElementById('btnPrevPage').disabled = currentPageIndex === 0;
            document.getElementById('btnNextPage').disabled = currentPageIndex === allPageUrls.length - 1;
        }

        window.prevPage = async function() {
            if(currentPageIndex > 0) {
                await saveCurrentCanvasAsync(); 
                currentPageIndex--; 
                renderCurrentPage();
            }
        };

        window.nextPage = async function() {
            if(currentPageIndex < allPageUrls.length - 1) {
                await saveCurrentCanvasAsync(); 
                currentPageIndex++; 
                renderCurrentPage();
            }
        };

        // --- ระบบจัดเก็บลายเส้นด้วย IndexedDB (LocalForage) ---
        async function saveCurrentCanvasAsync() {
            const canvas = document.getElementById(`canvas-page-${currentPageIndex}`);
            if(canvas) {
                const storageKey = `draft_${currentDocId}_page_${currentPageIndex}`;
                try {
                    await localforage.setItem(storageKey, canvas.toDataURL('image/png'));
                } catch(e) { console.error("Error saving to IndexedDB", e); }
            }
        }

        async function createCanvasPage(url, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'canvas-wrapper';
            
            const img = new Image();
            img.crossOrigin = "anonymous"; // สำคัญมาก: อนุญาตให้แปลงรูปลง PDF
            img.className = "bg-img";
            img.src = url;
            
            const canvas = document.createElement('canvas');
            canvas.id = `canvas-page-${index}`;
            
            const draftCanvas = document.createElement('canvas');
            draftCanvas.id = `draft-canvas-${index}`;
            draftCanvas.className = "draft-canvas";
            
            const storageKey = `draft_${currentDocId}_page_${index}`;
            
            return new Promise((resolve) => {
                img.onload = async () => {
                    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                    draftCanvas.width = img.naturalWidth; draftCanvas.height = img.naturalHeight;
                    
                    // ดึงลายเส้นเดิมจาก IndexedDB (แทน localStorage)
                    const savedDraft = await localforage.getItem(storageKey);
                    
                    workspace.innerHTML = ''; // ลบคำว่ากำลังโหลด
                    wrapper.appendChild(img); wrapper.appendChild(canvas); wrapper.appendChild(draftCanvas);
                    workspace.appendChild(wrapper);

                    const ctx = canvas.getContext('2d');
                    if (savedDraft) {
                        const draftImg = new Image();
                        draftImg.onload = () => {
                            ctx.drawImage(draftImg, 0, 0);
                            globalUndoStack.push({ index: index, imageData: ctx.getImageData(0, 0, canvas.width, canvas.height) });
                            resolve();
                        };
                        draftImg.src = savedDraft;
                    } else {
                        globalUndoStack.push({ index: index, imageData: ctx.getImageData(0, 0, canvas.width, canvas.height) });
                        resolve();
                    }
                    setupDrawingSystem(canvas, draftCanvas, index);
                };
            });
        }

        // --- ระบบ Apple Pencil (Pointer Events) ---
        function setupDrawingSystem(canvas, draftCanvas, pageIndex) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true }); 
            const draftCtx = draftCanvas.getContext('2d', { willReadFrequently: true }); 
            let isDrawing = false; let lastX = 0, lastY = 0;

            function getPos(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            }

            // รองรับทั้ง เมาส์, นิ้ว, และปากกาใน Event เดียว
            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                const pos = getPos(e.clientX, e.clientY);
                
                globalUndoStack.push({ index: pageIndex, imageData: ctx.getImageData(0, 0, canvas.width, canvas.height) });
                if (globalUndoStack.length > 50) globalUndoStack.shift();
                globalRedoStack = [];

                isDrawing = true; lastX = pos.x; lastY = pos.y;
                draftCanvas.style.opacity = (currentTool === 'highlighter') ? (currentOpacity * 0.4) : currentOpacity;
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                
                const pos = getPos(e.clientX, e.clientY);
                // อ่านค่าน้ำหนักปากกา (ถ้าไม่มีให้ตั้งค่าเริ่มต้นที่ 0.5)
                let pressure = e.pointerType === 'pen' && e.pressure > 0 ? e.pressure : 0.5;

                if (currentTool === 'eraser') {
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.globalAlpha = 1.0; ctx.lineWidth = currentSize * 6;
                    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
                } else {
                    draftCtx.lineCap = 'round'; draftCtx.lineJoin = 'round';
                    draftCtx.globalCompositeOperation = 'source-over';
                    draftCtx.globalAlpha = 1.0; 
                    
                    if (currentTool === 'highlighter') {
                        draftCtx.lineWidth = currentSize * 5; draftCtx.strokeStyle = currentColor;
                    } else {
                        // ปรับขนาดเส้นตามแรงกดของปากกา Apple Pencil
                        draftCtx.lineWidth = (pressure * currentSize * 2.5) + 1; draftCtx.strokeStyle = currentColor;
                    }
                    draftCtx.beginPath(); draftCtx.moveTo(lastX, lastY); draftCtx.lineTo(pos.x, pos.y); draftCtx.stroke();
                }
                lastX = pos.x; lastY = pos.y;
            });

            function stopAction(e) {
                if (isDrawing) {
                    if (currentTool !== 'eraser') {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.globalAlpha = currentTool === 'highlighter' ? currentOpacity * 0.4 : currentOpacity;
                        ctx.drawImage(draftCanvas, 0, 0);
                        draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
                    }
                    isDrawing = false; 
                    saveCurrentCanvasAsync(); // เซฟลง IndexedDB แบบพื้นหลัง ไม่กวนการวาด
                }
            }

            canvas.addEventListener('pointerup', stopAction);
            canvas.addEventListener('pointerleave', stopAction);
            canvas.addEventListener('pointercancel', stopAction);
        }

        async function clearDraft() {
            if(confirm('ต้องการลบลายมือหน้านี้ เพื่อเริ่มทำใหม่ใช่หรือไม่?')) {
                const canvas = document.getElementById(`canvas-page-${currentPageIndex}`);
                if(canvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height); 
                    
                    const storageKey = `draft_${currentDocId}_page_${currentPageIndex}`;
                    await localforage.removeItem(storageKey); 
                    
                    globalUndoStack = [{ index: currentPageIndex, imageData: ctx.getImageData(0,0,canvas.width,canvas.height) }];
                    globalRedoStack = [];
                }
            }
        }

        const modal = document.getElementById('exportModal');
        function openExportModal() { modal.style.display = 'flex'; }
        function closeExportModal() { modal.style.display = 'none'; }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image(); 
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img); 
                img.onerror = () => reject();
                img.src = src;
            });
        }

        async function executeDownload(format) {
            closeExportModal(); isSafeToLeave = true; 
            const btnSave = document.querySelector('.btn-primary');
            const originalText = btnSave.innerHTML;
            
            await saveCurrentCanvasAsync(); 

            try {
                if (format === 'pdf') {
                    const { jsPDF } = window.jspdf;
                    let pdf;
                    
                    for (let i = 0; i < allPageUrls.length; i++) {
                        btnSave.innerHTML = `⏳ สร้าง PDF (${i + 1}/${allPageUrls.length})...`;
                        const imgUrl = allPageUrls[i];
                        const storageKey = `draft_${currentDocId}_page_${i}`;
                        const savedDraft = await localforage.getItem(storageKey);

                        const bgImg = await loadImage(imgUrl);
                        const exportCanvas = document.createElement('canvas');
                        exportCanvas.width = bgImg.naturalWidth; exportCanvas.height = bgImg.naturalHeight;
                        const ctx = exportCanvas.getContext('2d');

                        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
                        ctx.drawImage(bgImg, 0, 0);

                        if (savedDraft) {
                            const draftImg = await loadImage(savedDraft);
                            ctx.drawImage(draftImg, 0, 0);
                        }

                        const imgData = exportCanvas.toDataURL('image/jpeg', 0.85);
                        const orientation = exportCanvas.width > exportCanvas.height ? 'l' : 'p';
                        
                        if (i === 0) pdf = new jsPDF({ orientation: orientation, unit: 'px', format: [exportCanvas.width, exportCanvas.height] });
                        else pdf.addPage([exportCanvas.width, exportCanvas.height], orientation);
                        
                        pdf.addImage(imgData, 'JPEG', 0, 0, exportCanvas.width, exportCanvas.height);
                    }
                    btnSave.innerHTML = "⏳ กำลังดาวน์โหลด...";
                    pdf.save('แบบฝึกหัด-ส่งงาน.pdf'); 
                } 
                else {
                    btnSave.innerHTML = "⏳ กำลังเซฟรูป...";
                    const imgUrl = allPageUrls[currentPageIndex];
                    const storageKey = `draft_${currentDocId}_page_${currentPageIndex}`;
                    const savedDraft = await localforage.getItem(storageKey);

                    const bgImg = await loadImage(imgUrl);
                    const exportCanvas = document.createElement('canvas');
                    exportCanvas.width = bgImg.naturalWidth; exportCanvas.height = bgImg.naturalHeight;
                    const ctx = exportCanvas.getContext('2d');

                    if (format === 'jpg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height); }
                    ctx.drawImage(bgImg, 0, 0);
                    if (savedDraft) { const draftImg = await loadImage(savedDraft); ctx.drawImage(draftImg, 0, 0); }

                    const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
                    const link = document.createElement('a');
                    link.download = `แบบฝึกหัด-หน้า${currentPageIndex + 1}.${format}`;
                    link.href = exportCanvas.toDataURL(mimeType, 1.0); 
                    link.click();
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการ Export โปรดลองใหม่อีกครั้ง');
                console.error(err);
            }
            
            btnSave.innerHTML = originalText;
            isSafeToLeave = false;
        }
    </script>
</body>
</html>
