<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>พื้นที่จดบันทึก</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
        input { -webkit-user-select: auto; user-select: auto; }
        
        :root { --primary: #007AFF; --danger: #FF3B30; --bg: #EAEBEE; --surface: #FFFFFF; --text: #1C1C1E; --border: #E5E5EA; --pill: #F2F2F7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background-color: var(--bg); text-align: center; margin: 0; padding: env(safe-area-inset-top) 16px 20px; transition: background-color 0.3s; overscroll-behavior-y: none; overflow-x: hidden; }
        
        /* 🛠️ Floating Toolbar */
        .toolbar-main { position: sticky; top: 16px; z-index: 1000; width: 100%; max-width: 900px; margin: 0 auto 24px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 10px 16px; border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(0,0,0,0.04); transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); touch-action: none; }
        .toolbar-main.hidden { opacity: 0; pointer-events: none; transform: translateY(-20px) scale(0.96); }
        .toolbar-row { display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 8px; }
        .tool-group { display: flex; align-items: center; background: var(--pill); padding: 4px; border-radius: 18px; gap: 4px; }
        
        /* Buttons */
        .btn { display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--text); border: none; padding: 0 16px; height: 36px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:active:not(:disabled) { transform: scale(0.92); background: rgba(0,0,0,0.05); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; border-radius: 14px; }
        .btn-primary:active { opacity: 0.9; }
        .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 14px; font-size: 18px; }
        .btn-icon.active { background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,0.06); color: var(--primary); }

        /* Colors & Sliders */
        .color-dot { width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer; margin: 0 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); transition: 0.2s; display: inline-flex; justify-content: center; align-items: center; }
        .color-dot.active { transform: scale(1.15); box-shadow: 0 0 0 2px var(--pill), 0 0 0 4px var(--primary); }
        
        .slider-wrapper { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #8E8E93; margin: 0 8px; }
        input[type="range"] { -webkit-appearance: none; width: 70px; height: 6px; background: rgba(0,0,0,0.1); border-radius: 3px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; }
        input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.2); }

        /* Workspace */
        #workspace { 
            width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; 
            transform-origin: center center; 
            transition: transform 0.05s linear; 
        }
        .canvas-wrapper { position: relative; background: var(--surface); box-shadow: 0 8px 32px rgba(0,0,0,0.05); border-radius: 12px; overflow: hidden; }
        .bg-img { width: 100%; display: block; user-select: none; pointer-events: none; }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; } 
        .draft-canvas { pointer-events: none; } 

        /* Floating Actions (Right) */
        .fab-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; touch-action: none; }
        .fab { width: 50px; height: 50px; border-radius: 25px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.1); font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .fab:active:not(:disabled) { transform: scale(0.85); }
        
        /* 🟢 Bottom Pagination (Center) */
        .bottom-pagination {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 6px 12px;
            gap: 12px;
            transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            touch-action: none;
        }
        .bottom-pagination.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 20px); }
        .page-indicator { font-size: 15px; font-weight: 600; min-width: 50px; text-align: center; cursor: pointer; color: var(--text); }
        .page-indicator:active { opacity: 0.6; }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        .modal-card { background: var(--surface); padding: 24px; border-radius: 24px; width: 90%; max-width: 360px; box-shadow: 0 24px 48px rgba(0,0,0,0.15); text-align: center; }
        .modal-card h3 { margin: 0 0 20px; font-size: 20px; font-weight: 600; }
        .btn-modal { display: block; width: 100%; padding: 14px; margin-bottom: 10px; font-size: 15px; font-weight: 600; border-radius: 14px; color: white; border: none; cursor: pointer; transition: 0.2s;}
        .btn-modal:active { transform: scale(0.96); }
        .btn-modal.pdf { background: #FF3B30; } .btn-modal.png { background: var(--primary); } .btn-modal.jpg { background: #34C759; } .btn-modal.orig { background: #8E8E93; }
        .btn-modal.cancel { background: var(--pill); color: var(--text); margin-top: 16px; }

        /* Thumbnails */
        #thumbnailModal .modal-card { max-width: 800px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 16px; }
        .thumb-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0; }
        .thumb-head h3 { margin: 0; }
        .btn-close { background: var(--pill); border: none; width: 32px; height: 32px; border-radius: 16px; cursor: pointer; transition: 0.2s; }
        .btn-close:active { transform: scale(0.85); }
        .thumbnail-grid-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px; min-height: 0; }
        .thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        .thumb-item { border-radius: 10px; overflow: hidden; border: 2px solid transparent; cursor: pointer; transition: 0.2s; background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .thumb-item:active { transform: scale(0.95); }
        .thumb-item.active { border-color: var(--primary); }
        .thumb-item img { width: 100%; height: 130px; object-fit: cover; display: block; background: #fafafa; }
        .thumb-num { padding: 6px; font-size: 12px; font-weight: 600; background: #fafafa; color: #555; }

        /* Dark Mode */
        body.dark-theme { background-color: #000000; --surface: #1C1C1E; --text: #FFFFFF; --border: #38383A; --pill: #2C2C2E; }
        body.dark-theme .toolbar-main, body.dark-theme .fab, body.dark-theme .bottom-pagination { background: rgba(28, 28, 30, 0.95); border-color: rgba(255,255,255,0.1); color: #fff; }
        body.dark-theme .btn, body.dark-theme .btn-close, body.dark-theme .page-indicator { color: #fff; }
        body.dark-theme .btn:active:not(:disabled) { background: rgba(255,255,255,0.1); }
        body.dark-theme .btn-icon.active { background: #3A3A3C; color: #0A84FF; }
        body.dark-theme input[type="range"] { background: rgba(255,255,255,0.2); }
        body.dark-theme .canvas-wrapper { box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="toolbar-main" id="mainToolbar" onpointerdown="window.lockDrawing(500); event.stopPropagation()" onpointermove="event.stopPropagation()">
        <div class="toolbar-row" style="justify-content: space-between;">
            <div class="tool-group" style="background: transparent;">
                <button class="btn" onclick="goBack()" style="color: var(--primary);">‹ กลับ</button>
            </div>
            <!-- ย้ายปุ่มเปลี่ยนหน้าไปไว้ด้านล่างแล้ว -->
            <div class="tool-group" style="background: transparent; gap: 8px;">
                <button class="btn" onclick="clearDraft()" style="color: var(--danger); background: var(--pill);">ล้าง</button>
                <button class="btn btn-primary" onclick="openExportModal()">ส่งออก</button>
            </div>
        </div>
        
        <div class="toolbar-row" style="justify-content: center;">
            <div class="tool-group">
                <button class="btn btn-icon" onclick="undo()">↩</button>
                <button class="btn btn-icon" onclick="redo()">↪</button>
            </div>
            <div class="tool-group">
                <button class="btn btn-icon active" id="btnPen" onclick="setTool('pen', this)">🖊️</button>
                <button class="btn btn-icon" id="btnHighlighter" onclick="setTool('highlighter', this)">🖍️</button>
                <button class="btn btn-icon" id="btnEraser" onclick="setTool('eraser', this)">🧽</button>
            </div>
            <div class="tool-group">
                <button class="color-dot active" style="background: #1D1D1F;" onclick="setColor('#1D1D1F', this)"></button>
                <button class="color-dot" style="background: #FF3B30;" onclick="setColor('#FF3B30', this)"></button>
                <button class="color-dot" style="background: #007AFF;" onclick="setColor('#007AFF', this)"></button>
                
                <label class="color-dot" id="customColorWrapper" for="hiddenColorPicker" style="background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); cursor: pointer; padding: 0; border: none; position: relative;">
                    <div id="customColorDisplay" style="width: 20px; height: 20px; border-radius: 50%; background: #34C759; border: 2px solid white; pointer-events: none;"></div>
                </label>
                <input type="color" id="hiddenColorPicker" value="#34C759" 
                       style="position: absolute; left: -9999px; top: -9999px; width: 0; height: 0; opacity: 0;"
                       oninput="updateCustomColor(this.value)" 
                       onchange="updateCustomColor(this.value)">
            </div>
            <div class="tool-group">
                <div class="slider-wrapper"><span>◍</span><input type="range" id="sizeSlider" min="1" max="50" value="5" oninput="currentSize = parseInt(this.value); window.lockDrawing(500);"></div>
                <div class="slider-wrapper"><span>◑</span><input type="range" id="opacitySlider" min="0.1" max="1" step="0.1" value="1" oninput="currentOpacity = parseFloat(this.value); window.lockDrawing(500);"></div>
            </div>
            <div class="tool-group">
                <button class="btn btn-icon" onclick="toggleTheme()">🌙</button>
            </div>
        </div>
    </div>

    <!-- 🟢 กล่องเปลี่ยนหน้าลอยตัว (ตรงกลางด้านล่าง) -->
    <div class="bottom-pagination" id="bottomPagination" style="display: none;" onpointerdown="window.lockDrawing(500); event.stopPropagation()" onpointermove="event.stopPropagation()">
        <button class="btn btn-icon" id="btnPrevPage" onclick="prevPage()">◀</button>
        <span class="page-indicator" id="pageIndicator" onclick="promptJumpPage()">1 / 1</span>
        <button class="btn btn-icon" id="btnNextPage" onclick="nextPage()">▶</button>
    </div>

    <!-- ปุ่มลอยมุมขวาล่าง -->
    <div class="fab-container" onpointerdown="window.lockDrawing(500); event.stopPropagation()" onpointermove="event.stopPropagation()">
        <button class="fab" id="btnThumb" onclick="openThumbnailModal()" style="display: none;">🎛️</button>
        <button class="fab" onclick="toggleMenu()"><span id="toggleIcon">🔽</span></button>
    </div>

    <div id="workspace"></div>

    <div id="exportModal" class="modal">
        <div class="modal-card">
            <h3>💾 รูปแบบไฟล์</h3>
            <button class="btn-modal pdf" onclick="executeDownload('pdf')">📄 PDF (รวมทุกหน้า)</button>
            <button class="btn-modal png" onclick="executeDownload('png')">🖼️ PNG (หน้านี้)</button>
            <button class="btn-modal jpg" onclick="executeDownload('jpg')">📸 JPG (หน้านี้)</button>
            <button class="btn-modal orig" onclick="downloadOriginal()">📥 ต้นฉบับ (ไฟล์เปล่า)</button>
            <button class="btn-modal cancel" onclick="closeExportModal()">ยกเลิก</button>
        </div>
    </div>

    <div id="thumbnailModal" class="modal">
        <div class="modal-card">
            <div class="thumb-head">
                <h3>🎛️ เลือกหน้า</h3>
                <button class="btn-close" onclick="closeThumbnailModal()">✕</button>
            </div>
            <div class="thumbnail-grid-container">
                <div class="thumb-grid" id="thumbnailGrid"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyA1sFQMLA7pd8sRkeqIH5H7Ixo7oDKBqeY", authDomain: "ipadeditpdf.firebaseapp.com", projectId: "ipadeditpdf", storageBucket: "ipadeditpdf.firebasestorage.app", messagingSenderId: "690618814362", appId: "1:690618814362:web:42c3779fd7b2b7e0d0b423" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const docId = new URLSearchParams(window.location.search).get('id');

        localforage.config({ name: 'iPadApp', storeName: 'drafts' });

        async function init() {
            if (docId) {
                try {
                    const snap = await getDoc(doc(db, "workbooks", docId));
                    if (snap.exists()) window.initializeWorkspace(snap.data().url, docId);
                    else { alert("ไม่พบข้อมูล"); window.location.href = 'index.html'; }
                } catch (e) { alert("ข้อผิดพลาด"); }
            } else window.location.href = 'index.html';
        }
        init();
    </script>

    <script>
        window.isDrawingLocked = false;
        let drawLockTimer = null;
        window.lockDrawing = function(ms = 500) {
            window.isDrawingLocked = true;
            clearTimeout(drawLockTimer);
            drawLockTimer = setTimeout(() => { window.isDrawingLocked = false; }, ms);
            if (window.stopDrawingAction) window.stopDrawingAction();
        };

        let isSafeToLeave = false; 
        window.onbeforeunload = e => { if (!isSafeToLeave) { e.preventDefault(); return e.returnValue = 'แน่ใจหรือไม่?'; } };
        window.history.pushState({ locked: true }, '');
        window.onpopstate = () => {
            if (!isSafeToLeave) {
                if (confirm('🚨 ออกจากหน้านี้ใช่หรือไม่? (งานเซฟไว้แล้ว)')) { isSafeToLeave = true; window.history.back(); } 
                else { window.history.pushState({ locked: true }, ''); }
            }
        };
        
        function goBack() { if(confirm('🚨 กลับหน้าแรกใช่หรือไม่?')) { isSafeToLeave = true; window.location.href = 'index.html'; } }

        let isDark = false, currentTool = 'pen', currentColor = '#1D1D1F', currentSize = 5, currentOpacity = 1.0;
        let globalUndo = [], globalRedo = [], urls = [], curIdx = 0, curDocId = "";
        let menuHidden = false;

        function toggleMenu() {
            menuHidden = !menuHidden;
            document.getElementById('mainToolbar').classList.toggle('hidden', menuHidden);
            
            // 🟢 ซ่อนกล่องเปลี่ยนหน้าด้วยเวลาปิดเมนู
            const bp = document.getElementById('bottomPagination');
            if (bp && urls.length > 1) bp.classList.toggle('hidden', menuHidden);
            
            document.getElementById('toggleIcon').innerText = menuHidden ? '🛠️' : '🔽';
            window.lockDrawing(500);
        }

        function toggleTheme() {
            isDark = !isDark; document.body.classList.toggle('dark-theme', isDark);
            window.lockDrawing(500);
        }

        function setTool(tool, el) {
            currentTool = tool;
            document.querySelectorAll('.btn-icon').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active'); else document.getElementById(tool==='highlighter'?'btnHighlighter':'btnPen').classList.add('active');
            window.lockDrawing(500);
        }

        window.setColor = function(color, el) {
            currentColor = color;
            document.querySelectorAll('.color-dot').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
            if(currentTool === 'eraser') setTool('pen', document.getElementById('btnPen'));
        }

        window.updateCustomColor = function(val) {
            document.getElementById('customColorDisplay').style.background = val;
            setColor(val, document.getElementById('customColorWrapper'));
            window.lockDrawing(1000); 
        }

        function undo() {
            window.lockDrawing(500);
            if (!globalUndo.length) return;
            const last = globalUndo.pop(), cvs = document.getElementById(`cvs-${last.idx}`);
            if (cvs) {
                const ctx = cvs.getContext('2d');
                globalRedo.push({ idx: last.idx, img: ctx.getImageData(0,0,cvs.width,cvs.height) });
                ctx.putImageData(last.img, 0, 0); saveCvs();
            }
        }

        function redo() {
            window.lockDrawing(500);
            if (!globalRedo.length) return;
            const next = globalRedo.pop(), cvs = document.getElementById(`cvs-${next.idx}`);
            if (cvs) {
                const ctx = cvs.getContext('2d');
                globalUndo.push({ idx: next.idx, img: ctx.getImageData(0,0,cvs.width,cvs.height) });
                ctx.putImageData(next.img, 0, 0); saveCvs();
            }
        }

        window.initializeWorkspace = function(urlStr, id) {
            urls = urlStr.split('|').map(u => u.trim()); curDocId = id; curIdx = 0;
            const show = urls.length > 1 ? 'flex' : 'none';
            
            // 🟢 โชว์เมนูเปลี่ยนหน้าด้านล่าง
            document.getElementById('bottomPagination').style.display = show;
            document.getElementById('btnThumb').style.display = show;
            
            renderPage();
        };

        async function renderPage() {
            document.getElementById('workspace').innerHTML = '<p style="color:#8E8E93; padding:60px;">⏳ กำลังโหลด...</p>'; 
            globalUndo = []; globalRedo = [];
            await createPage(urls[curIdx], curIdx);
            
            // 🟢 อัปเดตตัวเลขหน้าด้านล่าง
            document.getElementById('pageIndicator').innerText = `${curIdx + 1} / ${urls.length}`;
            
            const isFirst = curIdx === 0;
            const isLast = curIdx === urls.length - 1;
            
            document.getElementById('btnPrevPage').disabled = isFirst;
            document.getElementById('btnNextPage').disabled = isLast;
            
            window.lockDrawing(500);
        }

        window.prevPage = async () => { if(curIdx > 0) { await saveCvs(); curIdx--; window.resetZoom(); renderPage(); } };
        window.nextPage = async () => { if(curIdx < urls.length - 1) { await saveCvs(); curIdx++; window.resetZoom(); renderPage(); } };
        
        async function saveCvs() {
            const cvs = document.getElementById(`cvs-${curIdx}`);
            if(cvs) await localforage.setItem(`d_${curDocId}_${curIdx}`, cvs.toDataURL('image/png'));
        }

        async function createPage(url, idx) {
            const wrap = document.createElement('div'); wrap.className = 'canvas-wrapper';
            const img = new Image(); img.crossOrigin = "anonymous"; img.className = "bg-img"; img.src = url;
            const cvs = document.createElement('canvas'); cvs.id = `cvs-${idx}`;
            const dCvs = document.createElement('canvas'); dCvs.className = "draft-canvas";
            
            return new Promise(res => {
                img.onload = async () => {
                    cvs.width = dCvs.width = img.naturalWidth; cvs.height = dCvs.height = img.naturalHeight;
                    const saved = await localforage.getItem(`d_${curDocId}_${idx}`);
                    const ws = document.getElementById('workspace'); ws.innerHTML = '';
                    wrap.append(img, cvs, dCvs); ws.appendChild(wrap);
                    const ctx = cvs.getContext('2d');
                    if (saved) {
                        const sImg = new Image();
                        sImg.onload = () => { ctx.drawImage(sImg, 0, 0); globalUndo.push({ idx, img: ctx.getImageData(0,0,cvs.width,cvs.height) }); res(); };
                        sImg.src = saved;
                    } else { globalUndo.push({ idx, img: ctx.getImageData(0,0,cvs.width,cvs.height) }); res(); }
                    setupDraw(cvs, dCvs, idx);
                };
            });
        }

        // 🟢 เพิ่มระบบป้องกันการวาดทะลุไปโดนเมนูด้านล่าง
        function isProtectedZone(x, y) {
            const tb = document.getElementById('mainToolbar');
            if (!menuHidden && tb) { 
                const r = tb.getBoundingClientRect(); 
                if (y <= r.bottom + 30) return true; 
            }
            const fab = document.querySelector('.fab-container');
            if (fab) { 
                const r = fab.getBoundingClientRect(); 
                if (x >= r.left - 30 && y >= r.top - 30) return true; 
            }
            const bp = document.getElementById('bottomPagination');
            if (!menuHidden && bp && bp.style.display !== 'none') {
                const r = bp.getBoundingClientRect();
                if (x >= r.left - 30 && x <= r.right + 30 && y >= r.top - 30) return true;
            }
            return false;
        }

        function setupDraw(cvs, dCvs, idx) {
            const ctx = cvs.getContext('2d', { willReadFrequently: true }); 
            const dCtx = dCvs.getContext('2d', { willReadFrequently: true }); 
            let drawing = false, lX = 0, lY = 0;
            const getP = (cx, cy) => { const r = cvs.getBoundingClientRect(); return { x: (cx-r.left)*(cvs.width/r.width), y: (cy-r.top)*(cvs.height/r.height) }; };
            
            cvs.onpointerdown = e => {
                if (e.pointerType === 'touch') return;
                if (window.isDrawingLocked) return;
                if (e.buttons === 0) return;
                if (e.target.tagName !== 'CANVAS' || isProtectedZone(e.clientX, e.clientY)) return;

                e.preventDefault(); const p = getP(e.clientX, e.clientY);
                globalUndo.push({ idx, img: ctx.getImageData(0,0,cvs.width,cvs.height) });
                if (globalUndo.length > 50) globalUndo.shift(); globalRedo = [];
                drawing = true; lX = p.x; lY = p.y; 
                dCvs.style.opacity = currentTool === 'highlighter' ? currentOpacity * 0.4 : currentOpacity;
            };
            
            cvs.onpointermove = e => {
                if (!drawing || e.pointerType === 'touch') return; 
                if (window.isDrawingLocked || isProtectedZone(e.clientX, e.clientY) || e.buttons === 0) { stop(e); return; }

                e.preventDefault(); const p = getP(e.clientX, e.clientY);
                if (currentTool === 'eraser') {
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalCompositeOperation = 'destination-out';
                    ctx.globalAlpha = 1.0; ctx.lineWidth = currentSize * 6;
                    ctx.beginPath(); ctx.moveTo(lX, lY); ctx.lineTo(p.x, p.y); ctx.stroke();
                } else {
                    dCtx.lineCap = 'round'; dCtx.lineJoin = 'round'; dCtx.globalCompositeOperation = 'source-over'; dCtx.globalAlpha = 1.0; 
                    dCtx.lineWidth = currentTool === 'highlighter' ? currentSize * 5 : currentSize * 1.5; 
                    dCtx.strokeStyle = currentColor;
                    dCtx.beginPath(); dCtx.moveTo(lX, lY); dCtx.lineTo(p.x, p.y); dCtx.stroke();
                }
                lX = p.x; lY = p.y;
            };
            
            function stop(e) {
                if (e && e.pointerType === 'touch') return;
                if (drawing) {
                    if (currentTool !== 'eraser') {
                        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = currentTool === 'highlighter' ? currentOpacity * 0.4 : currentOpacity;
                        ctx.drawImage(dCvs, 0, 0); dCtx.clearRect(0,0,dCvs.width,dCvs.height);
                    }
                    drawing = false; saveCvs();
                }
            }

            window.stopDrawingAction = stop;

            cvs.onpointerup = cvs.onpointerleave = cvs.onpointercancel = stop;
            window.addEventListener('pointerup', stop);
        }

        async function clearDraft() {
            window.lockDrawing(500);
            if(confirm('ลบลายมือหน้านี้?')) {
                const cvs = document.getElementById(`cvs-${curIdx}`);
                if(cvs) {
                    const ctx = cvs.getContext('2d'); ctx.clearRect(0, 0, cvs.width, cvs.height); 
                    await localforage.removeItem(`d_${curDocId}_${curIdx}`); 
                    globalUndo = [{ idx: curIdx, img: ctx.getImageData(0,0,cvs.width,cvs.height) }]; globalRedo = [];
                }
            }
        }

        window.openThumbnailModal = () => {
            window.lockDrawing(500);
            const g = document.getElementById('thumbnailGrid'); g.innerHTML = '';
            urls.forEach((u, i) => {
                const d = document.createElement('div'); d.className = `thumb-item ${i === curIdx ? 'active' : ''}`;
                d.onclick = async () => { closeThumbnailModal(); if (i !== curIdx) { await saveCvs(); curIdx = i; window.resetZoom(); renderPage(); } };
                d.innerHTML = `<img src="${u}" loading="lazy"><div class="thumb-num">หน้า ${i + 1}</div>`; g.appendChild(d);
            });
            document.getElementById('thumbnailModal').style.display = 'flex';
        };
        window.closeThumbnailModal = () => document.getElementById('thumbnailModal').style.display = 'none';
        
        window.promptJumpPage = () => {
            const p = prompt(`ไปที่หน้า (1-${urls.length}):`, curIdx + 1);
            if (p) { const t = parseInt(p) - 1; if (t >= 0 && t < urls.length && t !== curIdx) { saveCvs().then(() => { curIdx = t; window.resetZoom(); renderPage(); }); } }
        };
        
        window.openExportModal = () => { window.lockDrawing(500); document.getElementById('exportModal').style.display = 'flex'; }
        window.closeExportModal = () => document.getElementById('exportModal').style.display = 'none';
        
        const loadImg = src => new Promise((res, rej) => { const i = new Image(); if (!src.startsWith('data:')) i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = () => rej(new Error('โหลดภาพล้มเหลว')); i.src = src; });

        window.executeDownload = async fmt => {
            closeExportModal(); isSafeToLeave = true; const b = document.querySelector('.btn-primary'), ot = b.innerHTML;
            await saveCvs(); 
            try {
                if (fmt === 'pdf') {
                    const { jsPDF } = window.jspdf; let pdf;
                    for (let i = 0; i < urls.length; i++) {
                        b.innerHTML = `⏳ สร้าง PDF (${i+1}/${urls.length})...`;
                        const bg = await loadImg(urls[i]), eCvs = document.createElement('canvas'); eCvs.width = bg.naturalWidth; eCvs.height = bg.naturalHeight;
                        const ctx = eCvs.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,eCvs.width,eCvs.height); ctx.drawImage(bg,0,0);
                        const act = document.getElementById(`cvs-${i}`);
                        if (act) ctx.drawImage(act,0,0); else { const s = await localforage.getItem(`d_${curDocId}_${i}`); if(s) ctx.drawImage(await loadImg(s),0,0); }
                        const d = eCvs.toDataURL('image/jpeg', 0.85), ori = eCvs.width > eCvs.height ? 'l' : 'p';
                        if (i === 0) pdf = new jsPDF({ orientation: ori, unit: 'px', format: [eCvs.width, eCvs.height] }); else pdf.addPage([eCvs.width, eCvs.height], ori);
                        pdf.addImage(d, 'JPEG', 0, 0, eCvs.width, eCvs.height);
                    }
                    b.innerHTML = "⏳ โหลด..."; pdf.save('แบบฝึกหัด.pdf'); 
                } else {
                    b.innerHTML = "⏳ เซฟ...";
                    const bg = await loadImg(urls[curIdx]), eCvs = document.createElement('canvas'); eCvs.width = bg.naturalWidth; eCvs.height = bg.naturalHeight;
                    const ctx = eCvs.getContext('2d'); if (fmt === 'jpg') { ctx.fillStyle = '#fff'; ctx.fillRect(0,0,eCvs.width,eCvs.height); } ctx.drawImage(bg,0,0);
                    const act = document.getElementById(`cvs-${curIdx}`);
                    if (act) ctx.drawImage(act,0,0); else { const s = await localforage.getItem(`d_${curDocId}_${curIdx}`); if(s) ctx.drawImage(await loadImg(s),0,0); }
                    const a = document.createElement('a'); a.download = `หน้า${curIdx+1}.${fmt}`; a.href = eCvs.toDataURL(fmt==='jpg'?'image/jpeg':'image/png', 1.0); a.click();
                }
            } catch (e) { alert('ข้อผิดพลาด: ' + e.message); }
            b.innerHTML = ot; isSafeToLeave = false;
        };

        window.downloadOriginal = async () => {
            closeExportModal(); isSafeToLeave = true; const b = document.querySelector('.btn-primary'), ot = b.innerHTML;
            try {
                if (urls.length > 1) {
                    const { jsPDF } = window.jspdf; let pdf;
                    for (let i = 0; i < urls.length; i++) {
                        b.innerHTML = `⏳ ดึงฉบับ (${i+1}/${urls.length})...`;
                        const bg = await loadImg(urls[i]), eCvs = document.createElement('canvas'); eCvs.width = bg.naturalWidth; eCvs.height = bg.naturalHeight;
                        const ctx = eCvs.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,eCvs.width,eCvs.height); ctx.drawImage(bg,0,0);
                        const d = eCvs.toDataURL('image/jpeg', 0.85), ori = eCvs.width > eCvs.height ? 'l' : 'p';
                        if (i === 0) pdf = new jsPDF({ orientation: ori, unit: 'px', format: [eCvs.width, eCvs.height] }); else pdf.addPage([eCvs.width, eCvs.height], ori);
                        pdf.addImage(d, 'JPEG', 0, 0, eCvs.width, eCvs.height);
                    }
                    b.innerHTML = "⏳ โหลด..."; pdf.save('ต้นฉบับ.pdf'); 
                } else {
                    b.innerHTML = "⏳ โหลด...";
                    const bg = await loadImg(urls[0]), eCvs = document.createElement('canvas'); eCvs.width = bg.naturalWidth; eCvs.height = bg.naturalHeight;
                    eCvs.getContext('2d').drawImage(bg,0,0);
                    const a = document.createElement('a'); a.download = `ต้นฉบับ.jpg`; a.href = eCvs.toDataURL('image/jpeg', 1.0); a.click();
                }
            } catch (e) { alert('ข้อผิดพลาด'); }
            b.innerHTML = ot; isSafeToLeave = false;
        };

        // ==========================================
        // 🔍 ระบบซูมและเลื่อนกระดาษด้วย 2 นิ้ว (Pinch & Pan)
        // ==========================================
        const wsElement = document.getElementById('workspace');
        window.wsScale = 1; 
        window.wsPanX = 0; 
        window.wsPanY = 0;
        let isZooming = false, startDist = 0, startScale = 1;
        let startPanX = 0, startPanY = 0, pinchCenter = {x:0, y:0};

        window.resetZoom = () => {
            window.wsScale = 1; window.wsPanX = 0; window.wsPanY = 0;
            wsElement.style.transform = `translate(0px, 0px) scale(1)`;
        };

        wsElement.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                isZooming = true;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                startDist = Math.hypot(dx, dy);
                startScale = window.wsScale;
                
                pinchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
                startPanX = window.wsPanX; 
                startPanY = window.wsPanY;
            }
        }, { passive: false });

        wsElement.addEventListener('touchmove', e => {
            if (isZooming && e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                
                window.wsScale = Math.max(0.5, Math.min(startScale * (dist / startDist), 5));
                
                const currentCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
                
                window.wsPanX = startPanX + (currentCenter.x - pinchCenter.x);
                window.wsPanY = startPanY + (currentCenter.y - pinchCenter.y);
                
                wsElement.style.transform = `translate(${window.wsPanX}px, ${window.wsPanY}px) scale(${window.wsScale})`;
            }
        }, { passive: false });

        wsElement.addEventListener('touchend', e => {
            if (e.touches.length < 2) isZooming = false;
        });

        document.addEventListener('touchmove', e => { 
            if (e.target.tagName === 'CANVAS' && e.touches.length === 1) e.preventDefault(); 
        }, { passive: false });

    </script>
</body>
