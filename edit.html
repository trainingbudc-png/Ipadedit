<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>พื้นที่จดบันทึก</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
        input { -webkit-user-select: auto; user-select: auto; }
        
        :root { 
            --primary: #007AFF; --danger: #FF3B30; --bg: #F4F5F7; --surface: #FFFFFF; 
            --text: #1D1D1F; --border: #E5E5EA; --pill-bg: #F0F0F5;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            background-color: var(--bg); text-align: center; margin: 0; padding: env(safe-area-inset-top) 16px 40px; 
            transition: background-color 0.3s; overscroll-behavior-y: none; 
        }
        
        /* --- 🎨 Floating Toolbar (Apple Style) --- */
        .header-tools { 
            position: sticky; top: 16px; z-index: 100; width: 100%; max-width: 900px; margin: 0 auto 24px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            padding: 12px 20px; border-radius: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(0,0,0,0.05);
            transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .header-tools.hidden { opacity: 0; pointer-events: none; transform: translateY(-20px) scale(0.95); }
        
        .toolbar-row { display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 12px; }
        .tool-group { display: flex; align-items: center; background: var(--pill-bg); padding: 4px; border-radius: 20px; gap: 4px; }
        
        /* Buttons */
        .btn-action {
            background: transparent; color: var(--text); border: none; padding: 0 16px; height: 36px;
            border-radius: 18px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-action:active:not(:disabled) { transform: scale(0.92); background: rgba(0,0,0,0.05); }
        .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 0 20px; height: 36px;
            border-radius: 18px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-primary:active { transform: scale(0.94); opacity: 0.9; }

        .tool-btn { 
            background: transparent; color: #555; border: none; 
            width: 40px; height: 40px; border-radius: 16px; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center; font-size: 20px; 
        }
        .tool-btn.active { background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,0.08); color: var(--primary); }

        /* Color Dots */
        .color-dot {
            width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer; margin: 0 4px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .color-dot.active { transform: scale(1.2); box-shadow: 0 0 0 2px var(--pill-bg), 0 0 0 4px var(--primary); }
        .color-picker-wrapper { position: relative; display: inline-flex; align-items: center; justify-content: center; margin: 0 4px; }
        .color-picker-wrapper input[type="color"] { 
            width: 28px; height: 28px; border: none; border-radius: 50%; cursor: pointer; padding: 0; 
            background: none; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        .color-picker-wrapper.active input[type="color"] { transform: scale(1.2); box-shadow: 0 0 0 2px var(--pill-bg), 0 0 0 4px var(--primary); }

        /* Sliders */
        .slider-group { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #8E8E93; margin: 0 8px; }
        input[type="range"] { 
            -webkit-appearance: none; width: 80px; height: 6px; background: rgba(0,0,0,0.1); 
            border-radius: 3px; outline: none; cursor: pointer; 
        }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; 
            background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s;
        }
        input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.2); }

        /* Pagination */
        #pageIndicator { font-size: 15px; font-weight: 600; color: var(--text); min-width: 50px; text-align: center; cursor: pointer; padding: 0 8px; border-radius: 12px;}
        #pageIndicator:active { background: #E5E5EA; }

        /* Workspace */
        #workspace { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;}
        .canvas-wrapper { 
            position: relative; background: var(--surface); box-shadow: 0 12px 48px rgba(0,0,0,0.08); 
            border-radius: 12px; overflow: hidden; 
        }
        .bg-img { width: 100%; display: block; user-select: none; pointer-events: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: auto; cursor: crosshair; }
        .draft-canvas { pointer-events: none; } 

        /* 📍 Floating Actions (Bottom Right) - จัดเรียงแนวตั้ง */
        .floating-actions {
            position: fixed; bottom: 24px; right: 24px; z-index: 1000;
            display: flex; flex-direction: column; gap: 12px; /* 👈 เปลี่ยนเป็น column */
        }
        .btn-floating {
            width: 54px; height: 54px; border-radius: 27px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            font-size: 24px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-floating:active { transform: scale(0.85); }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .modal-content { background: var(--surface); padding: 32px; border-radius: 24px; width: 90%; max-width: 380px; box-shadow: 0 24px 48px rgba(0,0,0,0.2); text-align: center; display: flex; flex-direction: column; }
        .modal-content h3 { margin: 0 0 24px; font-size: 22px; font-weight: 700; }
        .btn-export { display: block; width: 100%; padding: 16px; margin-bottom: 12px; font-size: 16px; font-weight: 600; border-radius: 16px; color: white; border: none; cursor: pointer; transition: 0.2s;}
        .btn-export:active { transform: scale(0.97); }
        .btn-export.pdf { background: #FF3B30; }
        .btn-export.png { background: var(--primary); }
        .btn-export.jpg { background: #34C759; }
        .btn-export.original { background: #8E8E93; }
        .btn-export.cancel { background: #F0F0F5; color: var(--text); margin-top: 12px; }

        /* Thumbnail Grid */
        #thumbnailModal .modal-content { max-width: 800px; width: 90%; max-height: 85vh; padding: 24px; }
        .thumbnail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .thumbnail-header h3 { margin: 0; font-size: 20px; }
        .btn-close-modal { background: #F0F0F5; border: none; width: 36px; height: 36px; border-radius: 18px; font-size: 16px; cursor: pointer; color: #555; transition: 0.2s;}
        .btn-close-modal:active { transform: scale(0.9); }
        .thumbnail-grid-container { overflow-y: auto; flex: 1; padding: 4px; }
        .thumbnail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px; }
        .thumbnail-item { cursor: pointer; border-radius: 12px; overflow: hidden; border: 3px solid transparent; transition: 0.2s; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .thumbnail-item:active { transform: scale(0.95); }
        .thumbnail-item.active { border-color: var(--primary); }
        .thumbnail-item img { width: 100%; display: block; object-fit: cover; height: 140px; background: #f9f9f9; }
        .thumbnail-page-num { padding: 8px; font-size: 14px; font-weight: 600; background: #fafafa; border-top: 1px solid #eee; color: #555; text-align: center;}

        /* 🌙 Dark Theme Refinements */
        body.dark-theme { background-color: #000000; --bg: #000000; --surface: #1C1C1E; --text: #FFFFFF; --border: #38383A; --pill-bg: #2C2C2E; }
        body.dark-theme .header-tools { background: rgba(28, 28, 30, 0.85); border-color: rgba(255,255,255,0.1); }
        body.dark-theme .btn-action, body.dark-theme .btn-close-modal { color: #fff; }
        body.dark-theme .btn-action:active:not(:disabled) { background: rgba(255,255,255,0.1); }
        body.dark-theme .tool-btn.active { background: #3A3A3C; color: #0A84FF; }
        body.dark-theme input[type="range"] { background: rgba(255,255,255,0.2); }
        body.dark-theme .canvas-wrapper { box-shadow: 0 12px 48px rgba(0,0,0,0.6); }
        body.dark-theme .btn-floating { background: rgba(44, 44, 46, 0.9); border-color: rgba(255,255,255,0.1); color: #fff; }
        body.dark-theme .thumbnail-item { background: #2C2C2E; }
        body.dark-theme .thumbnail-page-num { background: #1C1C1E; color: #fff; border-color: #38383A; }
    </style>
</head>
<body>

    <!-- 🛠️ Floating Toolbar -->
    <div class="header-tools" id="mainToolbar">
        
        <!-- Row 1: Navigation & Actions -->
        <div class="toolbar-row" style="justify-content: space-between;">
            <div class="tool-group" style="background: transparent;">
                <button class="btn-action" onclick="goBack()" style="color: var(--primary);">‹ แกลลอรี่</button>
            </div>

            <!-- Pagination Group -->
            <div class="tool-group" id="paginationBar" style="display: none;">
                <button class="btn-action" id="btnPrevPage" onclick="prevPage()">◀</button>
                <span id="pageIndicator" onclick="promptJumpPage()" title="แตะเพื่อข้ามหน้า">1 / 1</span>
                <button class="btn-action" id="btnNextPage" onclick="nextPage()">▶</button>
            </div>

            <div class="tool-group" style="background: transparent; gap: 8px;">
                <button class="btn-action" onclick="clearDraft()" style="color: var(--danger); background: var(--pill-bg);">ล้างหน้า</button>
                <button class="btn-primary" onclick="openExportModal()">ส่งออก</button>
            </div>
        </div>
        
        <!-- Row 2: Drawing Tools -->
        <div class="toolbar-row" style="justify-content: center;">
            <div class="tool-group">
                <button class="btn-action" onclick="undo()" title="ย้อนกลับ">↩</button>
                <button class="btn-action" onclick="redo()" title="ทำซ้ำ">↪</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn active" id="btnPen" onclick="setTool('pen', this)" title="ปากกา">🖊️</button>
                <button class="tool-btn" id="btnHighlighter" onclick="setTool('highlighter', this)" title="ไฮไลท์">🖍️</button>
                <button class="tool-btn" id="btnEraser" onclick="setTool('eraser', this)" title="ยางลบ">🧽</button>
            </div>
            
            <!-- Quick Colors -->
            <div class="tool-group">
                <button class="color-dot active" style="background: #1D1D1F;" onclick="setColor('#1D1D1F', this)"></button>
                <button class="color-dot" style="background: #FF3B30;" onclick="setColor('#FF3B30', this)"></button>
                <button class="color-dot" style="background: #007AFF;" onclick="setColor('#007AFF', this)"></button>
                <div class="color-picker-wrapper" id="customColorWrapper">
                    <input type="color" id="colorPicker" value="#34C759" onchange="setColor(this.value, document.getElementById('customColorWrapper'))">
                </div>
            </div>
            
            <!-- Sliders -->
            <div class="tool-group">
                <div class="slider-group" title="ขนาดหัวปากกา">
                    <span style="font-size: 16px;">◍</span>
                    <input type="range" id="sizeSlider" min="1" max="50" value="5" oninput="currentSize = parseInt(this.value)">
                </div>
                <div class="slider-group" title="ความโปร่งใส">
                    <span style="font-size: 16px;">◑</span>
                    <input type="range" id="opacitySlider" min="0.1" max="1" step="0.1" value="1" oninput="currentOpacity = parseFloat(this.value)">
                </div>
            </div>

            <div class="tool-group">
                <button class="btn-action" id="btnTheme" onclick="toggleTheme()" title="สลับโหมดสี">🌙</button>
            </div>
        </div>
    </div>

    <!-- Floating Actions (Bottom Right) -->
    <div class="floating-actions">
        <!-- ปุ่มดูทุกหน้า อยู่ด้านบน -->
        <button class="btn-floating" id="btnFloatingThumbnail" onclick="openThumbnailModal()" title="ดูทุกหน้า" style="display: none;">
            🎛️
        </button>
        <!-- ปุ่มซ่อนเมนู อยู่ด้านล่าง -->
        <button class="btn-floating" onclick="toggleMenu()" title="ซ่อน/แสดงเมนู">
            <span id="toggleIcon">🔽</span>
        </button>
    </div>

    <div id="workspace"></div>

    <!-- Modals (Export & Thumbnails) -->
    <div id="exportModal" class="modal-overlay">
        <div class="modal-content">
            <h3>💾 เลือกรูปแบบไฟล์</h3>
            <button class="btn-export pdf" onclick="executeDownload('pdf')">📄 PDF (รวมทุกหน้าพร้อมลายเส้น)</button>
            <button class="btn-export png" onclick="executeDownload('png')">🖼️ PNG (เฉพาะหน้านี้พร้อมลายเส้น)</button>
            <button class="btn-export jpg" onclick="executeDownload('jpg')">📸 JPG (เฉพาะหน้านี้พร้อมลายเส้น)</button>
            <button class="btn-export original" onclick="downloadOriginal()">📥 โหลดต้นฉบับ (ไฟล์เปล่า)</button>
            <button class="btn-export cancel" onclick="closeExportModal()">ยกเลิก</button>
        </div>
    </div>

    <div id="thumbnailModal" class="modal-overlay">
        <div class="modal-content">
            <div class="thumbnail-header">
                <h3>🎛️ เลือกหน้ากระดาษ</h3>
                <button class="btn-close-modal" onclick="closeThumbnailModal()">✕</button>
            </div>
            <div class="thumbnail-grid-container">
                <div class="thumbnail-grid" id="thumbnailGrid"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1sFQMLA7pd8sRkeqIH5H7Ixo7oDKBqeY", authDomain: "ipadeditpdf.firebaseapp.com",
            projectId: "ipadeditpdf", storageBucket: "ipadeditpdf.firebasestorage.app",
            messagingSenderId: "690618814362", appId: "1:690618814362:web:42c3779fd7b2b7e0d0b423"
        };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        const docId = new URLSearchParams(window.location.search).get('id');

        localforage.config({ name: 'iPadDrawingApp', storeName: 'workbooks_drafts' });

        async function init() {
            if (docId) {
                try {
                    const docSnap = await getDoc(doc(db, "workbooks", docId));
                    if (docSnap.exists()) window.initializeWorkspace(docSnap.data().url, docId);
                    else { alert("ไม่พบข้อมูล"); window.location.href = 'index.html'; }
                } catch (e) { alert("เกิดข้อผิดพลาด"); }
            } else window.location.href = 'index.html';
        }
        init();
    </script>

    <script>
        let isSafeToLeave = false; 
        window.addEventListener('beforeunload', e => { if (!isSafeToLeave) { e.preventDefault(); e.returnValue = ''; } });
        
        function goBack() { 
            if(confirm('ระบบบันทึกความคืบหน้าอัตโนมัติแล้ว\nต้องการกลับหน้าแรกใช่หรือไม่?')) {
                isSafeToLeave = true; window.location.href = 'index.html'; 
            }
        }

        let isDarkMode = false, currentTool = 'pen', currentColor = '#1D1D1F', currentSize = 5, currentOpacity = 1.0;
        let globalUndoStack = [], globalRedoStack = [], allPageUrls = [], currentPageIndex = 0, currentDocId = "";
        let isMenuHidden = false;

        function toggleMenu() {
            isMenuHidden = !isMenuHidden;
            const menu = document.getElementById('mainToolbar');
            const icon = document.getElementById('toggleIcon');
            if (isMenuHidden) {
                menu.classList.add('hidden');
                icon.innerText = '🛠️';
            } else {
                menu.classList.remove('hidden');
                icon.innerText = '🔽';
            }
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode; document.body.classList.toggle('dark-theme', isDarkMode);
            document.getElementById('btnTheme').innerHTML = isDarkMode ? '☀️' : '🌙'; 
        }

        function setTool(tool, btnElement) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            else document.getElementById(tool === 'highlighter' ? 'btnHighlighter' : 'btnPen').classList.add('active');
        }

        window.setColor = function(color, element) {
            currentColor = color;
            document.querySelectorAll('.color-dot, .color-picker-wrapper').forEach(b => b.classList.remove('active'));
            if(element) element.classList.add('active');
            if(currentTool === 'eraser') setTool('pen', document.getElementById('btnPen'));
        }

        function undo() {
            if (globalUndoStack.length === 0) return;
            const lastState = globalUndoStack.pop();
            const canvas = document.getElementById(`canvas-page-${lastState.index}`);
            if (canvas) {
                const ctx = canvas.getContext('2d');
                globalRedoStack.push({ index: lastState.index, imageData: ctx.getImageData(0, 0, canvas.width, canvas.height) });
                ctx.putImageData(lastState.imageData, 0, 0); saveCurrentCanvasAsync();
            }
        }

        function redo() {
            if (globalRedoStack.length === 0) return;
            const nextState = globalRedoStack.pop();
            const canvas = document.getElementById(`canvas-page-${nextState.index}`);
            if (canvas) {
                const ctx = canvas.getContext('2d');
                globalUndoStack.push({ index: nextState.index, imageData: ctx.getImageData(0, 0, canvas.width, canvas.height) });
                ctx.putImageData(nextState.imageData, 0, 0); saveCurrentCanvasAsync();
            }
        }

        window.initializeWorkspace = function(imageUrls, docId) {
            allPageUrls = imageUrls.split('|').map(url => url.trim()); currentDocId = docId; currentPageIndex = 0;
            
            const showPagination = allPageUrls.length > 1 ? 'flex' : 'none';
            document.getElementById('paginationBar').style.display = showPagination;
            document.getElementById('btnFloatingThumbnail').style.display = showPagination;
            
            renderCurrentPage();
        };

        async function renderCurrentPage() {
            document.getElementById('workspace').innerHTML = '<p style="color:#8E8E93; font-weight:600; padding:60px;">⏳ กำลังโหลดกระดาน...</p>'; 
            globalUndoStack = []; globalRedoStack = [];
            await createCanvasPage(allPageUrls[currentPageIndex], currentPageIndex);
            document.getElementById('pageIndicator').innerText = `${currentPageIndex + 1} / ${allPageUrls.length}`;
            document.getElementById('btnPrevPage').disabled = currentPageIndex === 0;
            document.getElementById('btnNextPage').disabled = currentPageIndex === allPageUrls.length - 1;
        }

        window.prevPage = async function() { if(currentPageIndex > 0) { await saveCurrentCanvasAsync(); currentPageIndex--; renderCurrentPage(); } };
        window.nextPage = async function() { if(currentPageIndex < allPageUrls.length - 1) { await saveCurrentCanvasAsync(); currentPageIndex++; renderCurrentPage(); } };

        async function saveCurrentCanvasAsync() {
            const canvas = document.getElementById(`canvas-page-${currentPageIndex}`);
            if(canvas) await localforage.setItem(`draft_${currentDocId}_page_${currentPageIndex}`, canvas.toDataURL('image/png'));
        }

        async function createCanvasPage(url, index) {
            const wrapper = document.createElement('div'); wrapper.className = 'canvas-wrapper';
            const img = new Image(); img.crossOrigin = "anonymous"; img.className = "bg-img"; img.src = url;
            const canvas = document.createElement('canvas'); canvas.id = `canvas-page-${index}`;
            const draftCanvas = document.createElement('canvas'); draftCanvas.id = `draft-canvas-${index}`; draftCanvas.className = "draft-canvas";
            
            return new Promise((resolve) => {
                img.onload = async () => {
                    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                    draftCanvas.width = img.naturalWidth; draftCanvas.height = img.naturalHeight;
                    const savedDraft = await localforage.getItem(`draft_${currentDocId}_page_${index}`);
                    const ws = document.getElementById('workspace'); ws.innerHTML = '';
                    wrapper.appendChild(img); wrapper.appendChild(canvas); wrapper.appendChild(draftCanvas); ws.appendChild(wrapper);

                    const ctx = canvas.getContext('2d');
                    if (savedDraft) {
                        const draftImg = new Image();
                        draftImg.onload = () => { ctx.drawImage(draftImg, 0, 0); globalUndoStack.push({ index, imageData: ctx.getImageData(0, 0, canvas.width, canvas.height) }); resolve(); };
                        draftImg.src = savedDraft;
                    } else { globalUndoStack.push({ index, imageData: ctx.getImageData(0, 0, canvas.width, canvas.height) }); resolve(); }
                    setupDrawingSystem(canvas, draftCanvas, index);
                };
            });
        }

        function setupDrawingSystem(canvas, draftCanvas, pageIndex) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true }); 
            const draftCtx = draftCanvas.getContext('2d', { willReadFrequently: true }); 
            let isDrawing = false, lastX = 0, lastY = 0;
            
            function getPos(clientX, clientY) {
                const rect = canvas.getBoundingClientRect(); 
                return { 
                    x: (clientX - rect.left) * (canvas.width / rect.width), 
                    y: (clientY - rect.top) * (canvas.height / rect.height) 
                };
            }
            
            canvas.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'touch') return; 
                e.preventDefault(); 
                const pos = getPos(e.clientX, e.clientY);
                globalUndoStack.push({ index: pageIndex, imageData: ctx.getImageData(0, 0, canvas.width, canvas.height) });
                if (globalUndoStack.length > 50) globalUndoStack.shift(); 
                globalRedoStack = [];
                isDrawing = true; 
                lastX = pos.x; lastY = pos.y; 
                draftCanvas.style.opacity = (currentTool === 'highlighter') ? (currentOpacity * 0.4) : currentOpacity;
            });
            
            canvas.addEventListener('pointermove', (e) => {
                if (!isDrawing || e.pointerType === 'touch') return; 
                e.preventDefault();
                const pos = getPos(e.clientX, e.clientY); 
                let pressure = e.pointerType === 'pen' && e.pressure > 0 ? e.pressure : 0.5;
                if (currentTool === 'eraser') {
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalCompositeOperation = 'destination-out';
                    ctx.globalAlpha = 1.0; ctx.lineWidth = currentSize * 6;
                    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
                } else {
                    draftCtx.lineCap = 'round'; draftCtx.lineJoin = 'round'; draftCtx.globalCompositeOperation = 'source-over'; draftCtx.globalAlpha = 1.0; 
                    draftCtx.lineWidth = currentTool === 'highlighter' ? currentSize * 5 : (pressure * currentSize * 2.5) + 1; 
                    draftCtx.strokeStyle = currentColor;
                    draftCtx.beginPath(); draftCtx.moveTo(lastX, lastY); draftCtx.lineTo(pos.x, pos.y); draftCtx.stroke();
                }
                lastX = pos.x; lastY = pos.y;
            });
            
            function stopAction(e) {
                if (e && e.pointerType === 'touch') return;
                if (isDrawing) {
                    if (currentTool !== 'eraser') {
                        ctx.globalCompositeOperation = 'source-over'; 
                        ctx.globalAlpha = currentTool === 'highlighter' ? currentOpacity * 0.4 : currentOpacity;
                        ctx.drawImage(draftCanvas, 0, 0); 
                        draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
                    }
                    isDrawing = false; 
                    saveCurrentCanvasAsync();
                }
            }
            
            canvas.addEventListener('pointerup', stopAction); 
            canvas.addEventListener('pointerleave', stopAction); 
            canvas.addEventListener('pointercancel', stopAction);
        }

        async function clearDraft() {
            if(confirm('ต้องการลบลายมือหน้านี้ เพื่อเริ่มทำใหม่ใช่หรือไม่?')) {
                const canvas = document.getElementById(`canvas-page-${currentPageIndex}`);
                if(canvas) {
                    const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); 
                    await localforage.removeItem(`draft_${currentDocId}_page_${currentPageIndex}`); 
                    globalUndoStack = [{ index: currentPageIndex, imageData: ctx.getImageData(0,0,canvas.width,canvas.height) }]; globalRedoStack = [];
                }
            }
        }

        window.openThumbnailModal = function() {
            const grid = document.getElementById('thumbnailGrid');
            grid.innerHTML = '';
            allPageUrls.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = `thumbnail-item ${index === currentPageIndex ? 'active' : ''}`;
                div.onclick = async () => {
                    closeThumbnailModal();
                    if (index !== currentPageIndex) {
                        await saveCurrentCanvasAsync();
                        currentPageIndex = index;
                        renderCurrentPage();
                    }
                };
                div.innerHTML = `<img src="${url}" loading="lazy"><div class="thumbnail-page-num">หน้า ${index + 1}</div>`;
                grid.appendChild(div);
            });
            document.getElementById('thumbnailModal').style.display = 'flex';
        }

        window.closeThumbnailModal = function() { document.getElementById('thumbnailModal').style.display = 'none'; }

        window.promptJumpPage = function() {
            const page = prompt(`ไปที่หน้า (1 - ${allPageUrls.length}):`, currentPageIndex + 1);
            if (page) {
                const target = parseInt(page) - 1;
                if (target >= 0 && target < allPageUrls.length && target !== currentPageIndex) {
                    saveCurrentCanvasAsync().then(() => {
                        currentPageIndex = target;
                        renderCurrentPage();
                    });
                }
            }
        }

        window.openExportModal = function() { document.getElementById('exportModal').style.display = 'flex'; }
        window.closeExportModal = function() { document.getElementById('exportModal').style.display = 'none'; }
        function loadImage(src) { return new Promise((res, rej) => { const img = new Image(); img.crossOrigin = "anonymous"; img.onload = () => res(img); img.onerror = rej; img.src = src; }); }

        window.executeDownload = async function(format) {
            closeExportModal(); isSafeToLeave = true; 
            const btnSave = document.querySelector('.btn-primary'); const originalText = btnSave.innerHTML;
            await saveCurrentCanvasAsync(); 
            try {
                if (format === 'pdf') {
                    const { jsPDF } = window.jspdf; let pdf;
                    for (let i = 0; i < allPageUrls.length; i++) {
                        btnSave.innerHTML = `⏳ สร้าง PDF (${i + 1}/${allPageUrls.length})...`;
                        const bgImg = await loadImage(allPageUrls[i]);
                        const exportCanvas = document.createElement('canvas'); exportCanvas.width = bgImg.naturalWidth; exportCanvas.height = bgImg.naturalHeight;
                        const ctx = exportCanvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height); ctx.drawImage(bgImg, 0, 0);
                        const savedDraft = await localforage.getItem(`draft_${currentDocId}_page_${i}`);
                        if (savedDraft) ctx.drawImage(await loadImage(savedDraft), 0, 0);
                        const imgData = exportCanvas.toDataURL('image/jpeg', 0.85); const orientation = exportCanvas.width > exportCanvas.height ? 'l' : 'p';
                        if (i === 0) pdf = new jsPDF({ orientation, unit: 'px', format: [exportCanvas.width, exportCanvas.height] });
                        else pdf.addPage([exportCanvas.width, exportCanvas.height], orientation);
                        pdf.addImage(imgData, 'JPEG', 0, 0, exportCanvas.width, exportCanvas.height);
                    }
                    btnSave.innerHTML = "⏳ ดาวน์โหลด..."; pdf.save('แบบฝึกหัด-ส่งงาน.pdf'); 
                } else {
                    btnSave.innerHTML = "⏳ เซฟรูป...";
                    const bgImg = await loadImage(allPageUrls[currentPageIndex]);
                    const exportCanvas = document.createElement('canvas'); exportCanvas.width = bgImg.naturalWidth; exportCanvas.height = bgImg.naturalHeight;
                    const ctx = exportCanvas.getContext('2d');
                    if (format === 'jpg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height); }
                    ctx.drawImage(bgImg, 0, 0);
                    const savedDraft = await localforage.getItem(`draft_${currentDocId}_page_${currentPageIndex}`);
                    if (savedDraft) ctx.drawImage(await loadImage(savedDraft), 0, 0);
                    const link = document.createElement('a'); link.download = `แบบฝึกหัด-หน้า${currentPageIndex + 1}.${format}`;
                    link.href = exportCanvas.toDataURL(format === 'jpg' ? 'image/jpeg' : 'image/png', 1.0); link.click();
                }
            } catch (err) { alert('เกิดข้อผิดพลาดในการ Export'); }
            btnSave.innerHTML = originalText; isSafeToLeave = false;
        }

        window.downloadOriginal = async function() {
            closeExportModal(); isSafeToLeave = true; 
            const btnSave = document.querySelector('.btn-primary'); const originalText = btnSave.innerHTML;
            try {
                if (allPageUrls.length > 1) {
                    const { jsPDF } = window.jspdf; let pdf;
                    for (let i = 0; i < allPageUrls.length; i++) {
                        btnSave.innerHTML = `⏳ ดึงต้นฉบับ (${i + 1}/${allPageUrls.length})...`;
                        const bgImg = await loadImage(allPageUrls[i]);
                        const exportCanvas = document.createElement('canvas'); exportCanvas.width = bgImg.naturalWidth; exportCanvas.height = bgImg.naturalHeight;
                        const ctx = exportCanvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height); ctx.drawImage(bgImg, 0, 0);
                        const imgData = exportCanvas.toDataURL('image/jpeg', 0.85); const orientation = exportCanvas.width > exportCanvas.height ? 'l' : 'p';
                        if (i === 0) pdf = new jsPDF({ orientation, unit: 'px', format: [exportCanvas.width, exportCanvas.height] });
                        else pdf.addPage([exportCanvas.width, exportCanvas.height], orientation);
                        pdf.addImage(imgData, 'JPEG', 0, 0, exportCanvas.width, exportCanvas.height);
                    }
                    btnSave.innerHTML = "⏳ ดาวน์โหลด..."; pdf.save('ไฟล์ต้นฉบับ.pdf'); 
                } else {
                    btnSave.innerHTML = "⏳ ดึงต้นฉบับ...";
                    const bgImg = await loadImage(allPageUrls[0]);
                    const exportCanvas = document.createElement('canvas'); exportCanvas.width = bgImg.naturalWidth; exportCanvas.height = bgImg.naturalHeight;
                    const ctx = exportCanvas.getContext('2d'); ctx.drawImage(bgImg, 0, 0);
                    const link = document.createElement('a'); link.download = `ไฟล์ต้นฉบับ.jpg`;
                    link.href = exportCanvas.toDataURL('image/jpeg', 1.0); link.click();
                }
            } catch (err) { alert('เกิดข้อผิดพลาดในการดึงไฟล์ต้นฉบับ'); }
            btnSave.innerHTML = originalText; isSafeToLeave = false;
        }

        // --- Strict Palm Rejection ---
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('#workspace') && e.touches.length === 1) {
                e.preventDefault();
            }
        }, { passive: false });

    </script>
</body>
